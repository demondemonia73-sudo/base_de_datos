<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
    <style>
        .control-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg-base);
            padding: 20px;
        }
        .control-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-lg);
        }
        .control-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .control-icon {
            width: 64px;
            height: 64px;
            background: #1a1a1a;
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
        }
        .control-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        .status-block {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }
        .status-indicator {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
        }
        .status-on  { color: #4ade80; }
        .status-off { color: #f87171; }
        .kill-btn {
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .kill-btn-activate   { background: #dc2626; }
        .kill-btn-activate:hover { background: #b91c1c; }
        .kill-btn-deactivate { background: #16a34a; }
        .kill-btn-deactivate:hover { background: #15803d; }
        .log-area {
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            max-height: 120px;
            overflow-y: auto;
            margin-top: 16px;
        }
        .log-line { margin-bottom: 4px; }
        .log-line.ok  { color: #4ade80; }
        .log-line.err { color: #f87171; }
        .log-line.info { color: #60a5fa; }
    </style>
</head>
<body>

<!-- VERIFICAR CLAVE EN URL: ms-control.html?key=KillMS#2025! -->
<div class="control-page">
    <div class="control-card">
        <div class="control-header">
            <div class="control-icon">⚙️</div>
            <div class="control-title">SYSTEM CONTROL</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono);">INDUSTRIAL MS · PANEL MAESTRO</div>
        </div>

        <!-- Auth -->
        <div id="authSection">
            <div class="form-group">
                <label>Clave Maestra</label>
                <div class="password-wrapper">
                    <input type="password" id="masterKey" placeholder="••••••••••••">
                    <button type="button" class="toggle-password" onclick="
                        const i=document.getElementById('masterKey');
                        i.type=i.type==='password'?'text':'password';
                        this.textContent=i.type==='password'?'👁':'🙈';
                    ">👁</button>
                </div>
            </div>
            <div class="form-group">
                <label>Email Superusuario</label>
                <input type="email" id="superEmail" placeholder="superadmin@industrial-ms.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="superPassword" placeholder="••••••••••••">
            </div>
            <div id="authError" class="msg msg-error"></div>
            <button class="btn kill-btn" onclick="autenticar()">🔐 Autenticar</button>
        </div>

        <!-- Panel de control (oculto hasta autenticar) -->
        <div id="controlSection" style="display:none;">
            <div class="status-block">
                <div>
                    <div class="status-label">ESTADO DEL SISTEMA</div>
                    <div class="status-indicator" id="sysStatus">Verificando...</div>
                </div>
                <div style="font-size:28px;" id="sysIcon">⏳</div>
            </div>

            <button class="btn kill-btn kill-btn-activate" id="btnActivar" onclick="activarKill()" style="display:none;">
                🔴 BLOQUEAR SISTEMA
            </button>
            <button class="btn kill-btn kill-btn-deactivate" id="btnDesactivar" onclick="desactivarKill()" style="display:none;">
                🟢 REACTIVAR SISTEMA
            </button>

            <button class="btn btn-secondary kill-btn" onclick="cerrarSesion()">
                🚪 Cerrar Sesión
            </button>

            <div class="log-area" id="logArea">
                <div class="log-line info">▶ Panel iniciado</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ── Clave maestra hardcodeada (ofuscada) ──────
    const _mk = atob('S2lsbE1TIzIwMjUh'); // KillMS#2025!
    const SUPER_EMAIL = 'superadmin@industrial-ms.com';

    function log(msg, tipo = 'info') {
        const area = document.getElementById('logArea');
        const line = document.createElement('div');
        line.className = `log-line ${tipo}`;
        const hora = new Date().toLocaleTimeString('es-ES');
        line.textContent = `[${hora}] ${msg}`;
        area.appendChild(line);
        area.scrollTop = area.scrollHeight;
    }

    async function autenticar() {
        const key      = document.getElementById('masterKey').value;
        const email    = document.getElementById('superEmail').value.trim();
        const password = document.getElementById('superPassword').value;
        const errEl    = document.getElementById('authError');

        errEl.style.display = 'none';

        if (key !== _mk) {
            errEl.textContent = 'Clave maestra incorrecta.';
            errEl.style.display = 'block';
            return;
        }

        if (email !== SUPER_EMAIL) {
            errEl.textContent = 'Usuario no autorizado.';
            errEl.style.display = 'block';
            return;
        }

        try {
            const { error } = await window.db.auth.signInWithPassword({ email, password });
            if (error) throw error;

            document.getElementById('authSection').style.display = 'none';
            document.getElementById('controlSection').style.display = 'block';
            log('Autenticación exitosa', 'ok');
            await verificarEstado();
        } catch (err) {
            errEl.textContent = 'Error: ' + err.message;
            errEl.style.display = 'block';
        }
    }

    async function verificarEstado() {
        const { data } = await window.db
            .from('system_config')
            .select('value')
            .eq('key', 'kill_switch')
            .single();

        const bloqueado = data?.value === 'true';
        actualizarUI(bloqueado);
        log(`Estado actual: ${bloqueado ? 'BLOQUEADO' : 'ACTIVO'}`, bloqueado ? 'err' : 'ok');
    }

    function actualizarUI(bloqueado) {
        const status = document.getElementById('sysStatus');
        const icon   = document.getElementById('sysIcon');
        const btnA   = document.getElementById('btnActivar');
        const btnD   = document.getElementById('btnDesactivar');

        if (bloqueado) {
            status.textContent = 'BLOQUEADO';
            status.className   = 'status-indicator status-off';
            icon.textContent   = '🔴';
            btnA.style.display = 'none';
            btnD.style.display = 'block';
        } else {
            status.textContent = 'ACTIVO';
            status.className   = 'status-indicator status-on';
            icon.textContent   = '🟢';
            btnA.style.display = 'block';
            btnD.style.display = 'none';
        }
    }

    async function activarKill() {
        if (!confirm('⚠️ ¿Bloquear el sistema para todos los usuarios?')) return;
        await window.db.from('system_config')
            .upsert({ key: 'kill_switch', value: 'true' }, { onConflict: 'key' });
        log('Kill switch ACTIVADO — sistema bloqueado', 'err');
        actualizarUI(true);
        mostrarToast('Sistema bloqueado', 'error');
    }

    async function desactivarKill() {
        if (!confirm('¿Reactivar el sistema para todos los usuarios?')) return;
        await window.db.from('system_config')
            .upsert({ key: 'kill_switch', value: 'false' }, { onConflict: 'key' });
        log('Kill switch DESACTIVADO — sistema reactivado', 'ok');
        actualizarUI(false);
        mostrarToast('Sistema reactivado', 'success');
    }

    async function cerrarSesion() {
        await window.db.auth.signOut();
        location.reload();
    }

    // Verificar clave en URL (opcional: ?key=KillMS%232025!)
    const urlKey = new URLSearchParams(window.location.search).get('key');
    if (urlKey && urlKey === _mk) {
        document.getElementById('masterKey').value = urlKey;
        log('Clave detectada en URL', 'info');
    }
</script>
</body>
</html>
