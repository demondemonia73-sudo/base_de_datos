<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Reportes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
    <style>
        .report-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 20px;
        }
        .report-card {
            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .report-card:hover {
            border-color: #ff3b30;
            transform: translateY(-4px);
        }
        .report-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .report-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .report-card p {
            color: #888;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .report-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        @media (max-width: 768px) {
            .report-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">🔧</div>
            <div class="logo-text">
                <h1>INDUSTRIAL MS</h1>
                <p>MAINTENANCE SYSTEM</p>
            </div>
        </div>
        <div class="nav-menu">
            <button class="nav-btn" onclick="location.href='dashboard.html'">📊 DASHBOARD</button>
            <button class="nav-btn" onclick="location.href='equipos.html'">🔌 EQUIPOS</button>
            <button class="nav-btn" onclick="location.href='ordenes.html'">📋 OT</button>
            <button class="nav-btn" onclick="location.href='actividades.html'">⏱️ ACTIVIDADES</button>
            <button class="nav-btn active" onclick="location.href='reportes.html'">📈 REPORTES</button>
            <button class="nav-btn logout-btn" id="logoutBtn">🚪 SALIR</button>
        </div>
        <div class="user-info">
            <div class="user-avatar">👤</div>
            <div class="user-details">
                <div class="user-name" id="userName">Usuario</div>
                <div class="user-role" id="userRol">ADMIN</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-title">📊 CENTRO DE REPORTES</div>
            <div class="report-grid">
                <div class="report-card">
                    <div class="report-icon">🔌</div>
                    <h3>EQUIPOS</h3>
                    <p>Catálogo completo de equipos con criticidad</p>
                    <div class="report-buttons">
                        <button class="btn" style="background:#28a745;" onclick="exportarEquiposExcel()">📊 EXCEL</button>
                        <button class="btn" style="background:#ff3b30;" onclick="exportarEquiposPDF()">📄 PDF</button>
                    </div>
                </div>
                <div class="report-card">
                    <div class="report-icon">📋</div>
                    <h3>ÓRDENES DE TRABAJO</h3>
                    <p>Todas las OT con su estado y prioridad</p>
                    <div class="report-buttons">
                        <button class="btn" style="background:#28a745;" onclick="exportarOTsExcel()">📊 EXCEL</button>
                        <button class="btn" style="background:#ff3b30;" onclick="exportarOTsPDF()">📄 PDF</button>
                    </div>
                </div>
                <div class="report-card">
                    <div class="report-icon">⏱️</div>
                    <h3>ACTIVIDADES</h3>
                    <p>Detalle de actividades por orden de trabajo</p>
                    <div class="report-buttons">
                        <button class="btn" style="background:#28a745;" onclick="exportarActividadesExcel()">📊 EXCEL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            await verificarSesion();
            document.getElementById('logoutBtn').onclick = logout;
        }

        async function exportarEquiposExcel() {
            const { data } = await supabase.from('equipos').select('*');
            exportarExcel(data, 'equipos', 'Equipos');
        }

        async function exportarEquiposPDF() {
            const { data } = await supabase.from('equipos').select('numero, nombre, codigo_completo, criticidad, centro_costo, proceso');
            const body = (data || []).map(e => [e.numero, e.nombre, e.codigo_completo, e.criticidad, e.centro_costo, e.proceso]);
            exportarPDF(['N°', 'EQUIPO', 'CÓDIGO', 'CRITICIDAD', 'CENTRO COSTO', 'PROCESO'], body, 'equipos');
        }

        async function exportarOTsExcel() {
            const { data } = await supabase.from('ordenes_trabajo').select('*, equipos(nombre)');
            const exportData = (data || []).map(ot => ({
                'N° OT': ot.numero_ot,
                'Equipo': ot.equipos?.nombre || ot.equipo_nombre,
                'Título': ot.titulo,
                'Prioridad': ot.prioridad,
                'Estado': ot.estado,
                'Fecha': new Date(ot.created_at).toLocaleDateString()
            }));
            exportarExcel(exportData, 'ordenes_trabajo', 'OTs');
        }

        async function exportarOTsPDF() {
            const { data } = await supabase.from('ordenes_trabajo').select('numero_ot, titulo, prioridad, estado');
            const body = (data || []).map(ot => [ot.numero_ot, ot.titulo, ot.prioridad, ot.estado]);
            exportarPDF(['N° OT', 'TÍTULO', 'PRIORIDAD', 'ESTADO'], body, 'ordenes_trabajo');
        }

        async function exportarActividadesExcel() {
            const { data } = await supabase.from('actividades_ot').select('*, ordenes_trabajo(numero_ot)');
            const exportData = (data || []).map(act => ({
                'OT': act.ordenes_trabajo?.numero_ot,
                'Descripción': act.descripcion,
                'Técnico': act.tecnico,
                'Inicio': act.inicio ? new Date(act.inicio).toLocaleString() : '-',
                'Fin': act.fin ? new Date(act.fin).toLocaleString() : '-',
                'Horas': act.total_horas,
                'Estado': act.estado
            }));
            exportarExcel(exportData, 'actividades', 'Actividades');
        }

        init();
    </script>
</body>
</html>
