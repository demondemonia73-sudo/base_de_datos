<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Sistema de Mantenimiento</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <style>
        .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .report-card { background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .report-card h3 { margin-bottom: 20px; color: #333; }
        .report-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>🔧 Sistema de Mantenimiento</h2>
        <div class="nav-menu">
            <a href="dashboard.html"><button class="nav-btn">📊 Dashboard</button></a>
            <a href="equipos.html"><button class="nav-btn">🔌 Equipos</button></a>
            <a href="ordenes.html"><button class="nav-btn">📋 Órdenes OT</button></a>
            <a href="actividades.html"><button class="nav-btn">⏱️ Actividades</button></a>
            <a href="reportes.html"><button class="nav-btn active">📈 Reportes</button></a>
            <button class="nav-btn logout-btn" onclick="logout()">🚪 Salir</button>
        </div>
        <div>👤 <span id="userName"></span> | <span id="userRol"></span></div>
    </div>

    <div class="main-content">
        <div class="card">
            <h3>📊 Generación de Reportes</h3>
            <div class="report-grid">
                <div class="report-card">
                    <h3>📋 Equipos</h3>
                    <div class="report-buttons">
                        <button class="btn btn-success" style="width: auto;" onclick="exportarEquiposExcel()">📊 Excel</button>
                        <button class="btn btn-danger" style="width: auto;" onclick="exportarEquiposPDF()">📄 PDF</button>
                    </div>
                </div>
                <div class="report-card">
                    <h3>📋 Órdenes de Trabajo</h3>
                    <div class="report-buttons">
                        <button class="btn btn-success" style="width: auto;" onclick="exportarOTsExcel()">📊 Excel</button>
                        <button class="btn btn-danger" style="width: auto;" onclick="exportarOTsPDF()">📄 PDF</button>
                    </div>
                </div>
                <div class="report-card">
                    <h3>⏱️ Actividades</h3>
                    <div class="report-buttons">
                        <button class="btn btn-success" style="width: auto;" onclick="exportarActividadesExcel()">📊 Excel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let supabase;

        async function init() {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            const { data: perfil } = await supabase.from('perfiles').select('*').eq('id', session.user.id).single();
            document.getElementById('userName').textContent = perfil?.nombre || 'Usuario';
            document.getElementById('userRol').textContent = perfil?.rol?.toUpperCase() || 'OPERADOR';
        }

        async function exportarEquiposExcel() {
            const { data } = await supabase.from('equipos').select('*');
            const ws = XLSX.utils.json_to_sheet(data || []);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Equipos');
            XLSX.writeFile(wb, `equipos_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        async function exportarEquiposPDF() {
            const { data } = await supabase.from('equipos').select('numero, nombre, codigo_completo, criticidad');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            doc.autoTable({ head: [['N°', 'Equipo', 'Código', 'Criticidad']], body: (data || []).map(e => [e.numero, e.nombre, e.codigo_completo, e.criticidad]), theme: 'striped', styles: { fontSize: 8 }, headStyles: { fillColor: [102, 126, 234] } });
            doc.save(`equipos_${new Date().toISOString().split('T')[0]}.pdf`);
        }

        async function exportarOTsExcel() {
            const { data } = await supabase.from('ordenes_trabajo').select('*, equipos(nombre)');
            const exportData = (data || []).map(ot => ({ 'N° OT': ot.numero_ot, 'Equipo': ot.equipos?.nombre || ot.equipo_nombre, 'Título': ot.titulo, 'Prioridad': ot.prioridad, 'Estado': ot.estado, 'Fecha': new Date(ot.created_at).toLocaleDateString() }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Ordenes_Trabajo');
            XLSX.writeFile(wb, `ots_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        async function exportarOTsPDF() {
            const { data } = await supabase.from('ordenes_trabajo').select('numero_ot, titulo, prioridad, estado');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            doc.autoTable({ head: [['N° OT', 'Título', 'Prioridad', 'Estado']], body: (data || []).map(ot => [ot.numero_ot, ot.titulo, ot.prioridad, ot.estado]), theme: 'striped', styles: { fontSize: 8 }, headStyles: { fillColor: [102, 126, 234] } });
            doc.save(`ots_${new Date().toISOString().split('T')[0]}.pdf`);
        }

        async function exportarActividadesExcel() {
            const { data } = await supabase.from('actividades_ot').select('*, ordenes_trabajo(numero_ot)');
            const exportData = (data || []).map(act => ({ 'OT': act.ordenes_trabajo?.numero_ot, 'Descripción': act.descripcion, 'Técnico': act.tecnico, 'Inicio': act.inicio ? new Date(act.inicio).toLocaleString() : '-', 'Fin': act.fin ? new Date(act.fin).toLocaleString() : '-', 'Horas': act.total_horas, 'Estado': act.estado }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Actividades');
            XLSX.writeFile(wb, `actividades_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        async function logout() { await supabase.auth.signOut(); window.location.href = 'index.html'; }
        
        init();
    </script>
</body>
</html>
