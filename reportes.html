<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Reportes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 20px; }
        .report-card { background: #121212; border: 1px solid #2a2a2a; border-radius: 20px; padding: 32px; text-align: center; transition: all 0.2s; }
        .report-card:hover { border-color: #ff3b30; transform: translateY(-2px); }
        .report-icon { font-size: 48px; margin-bottom: 16px; }
        .report-card h3 { font-size: 18px; margin-bottom: 8px; }
        .report-card p { color: #888; font-size: 13px; margin-bottom: 24px; }
        .report-buttons { display: flex; gap: 12px; justify-content: center; }
        @media (max-width: 768px) { .report-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-area"><div class="logo-icon">🔧</div><div class="logo-text"><h1>INDUSTRIAL MS</h1><p>MAINTENANCE SYSTEM</p></div></div>
        <div class="nav-menu">
            <button class="nav-btn" onclick="location.href='dashboard.html'">📊 DASHBOARD</button>
            <button class="nav-btn" onclick="location.href='equipos.html'">🔌 EQUIPOS</button>
            <button class="nav-btn" onclick="location.href='ordenes.html'">📋 OT</button>
            <button class="nav-btn" onclick="location.href='actividades.html'">⏱️ ACTIVIDADES</button>
            <button class="nav-btn active" onclick="location.href='reportes.html'">📈 REPORTES</button>
            <button class="nav-btn" id="navUsuarios" style="display:none;" onclick="location.href='usuarios.html'">👥 USUARIOS</button>
            <button class="nav-btn logout-btn" id="logoutBtn">🚪 SALIR</button>
        </div>
        <div class="user-info"><div class="user-avatar">👤</div><div><div class="user-name" id="userName">Usuario</div><div class="user-role" id="userRol">ROL</div></div></div>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-title">📊 REPORTES</div>
            <div class="report-grid">
                <div class="report-card"><div class="report-icon">🔌</div><h3>EQUIPOS</h3><p>Catálogo de equipos</p><div class="report-buttons"><button class="btn btn-secondary btn-sm" onclick="exportEquiposExcel()">📊 EXCEL</button><button class="btn btn-secondary btn-sm" onclick="exportEquiposPDF()">📄 PDF</button></div></div>
                <div class="report-card"><div class="report-icon">📋</div><h3>ÓRDENES</h3><p>Todas las OT</p><div class="report-buttons"><button class="btn btn-secondary btn-sm" onclick="exportOTsExcel()">📊 EXCEL</button><button class="btn btn-secondary btn-sm" onclick="exportOTsPDF()">📄 PDF</button></div></div>
                <div class="report-card"><div class="report-icon">⏱️</div><h3>ACTIVIDADES</h3><p>Detalle de actividades</p><div class="report-buttons"><button class="btn btn-secondary btn-sm" onclick="exportActividadesExcel()">📊 EXCEL</button></div></div>
            </div>
        </div>
    </div>

    <script>
        let supabase, currentUserRol = null;

        function initSupabase() {
            const SUPABASE_URL = 'https://inghjpgqahmceplasunr.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_-_MBMDKrs8qfUlwscp9phQ_V9w1TjYv';
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        initSupabase();

        async function logout() { await supabase.auth.signOut(); window.location.href = 'index.html'; }

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            const { data: perfil } = await supabase.from('perfiles').select('nombre, rol').eq('id', session.user.id).single();
            if (perfil) {
                document.getElementById('userName').textContent = perfil.nombre;
                document.getElementById('userRol').textContent = perfil.rol?.toUpperCase();
                currentUserRol = perfil.rol;
                if (currentUserRol === 'admin') document.getElementById('navUsuarios').style.display = 'block';
            }
            document.getElementById('logoutBtn').onclick = logout;
        }

        async function exportEquiposExcel() { const { data } = await supabase.from('equipos').select('*'); const ws = XLSX.utils.json_to_sheet(data || []); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Equipos'); XLSX.writeFile(wb, `equipos_${new Date().toISOString().split('T')[0]}.xlsx`); }
        async function exportEquiposPDF() { const { data } = await supabase.from('equipos').select('numero, nombre, codigo_completo, criticidad'); const { jsPDF } = window.jspdf; const doc = new jsPDF('landscape'); doc.autoTable({ head: [['N°', 'EQUIPO', 'CÓDIGO', 'CRITICIDAD']], body: (data || []).map(e => [e.numero, e.nombre, e.codigo_completo, e.criticidad]), theme: 'striped', styles: { fontSize: 8 }, headStyles: { fillColor: [255,59,48] } }); doc.save(`equipos_${new Date().toISOString().split('T')[0]}.pdf`); }
        async function exportOTsExcel() { const { data } = await supabase.from('ordenes_trabajo').select('numero_ot, titulo, prioridad, estado, created_at'); const ws = XLSX.utils.json_to_sheet(data || []); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'OTs'); XLSX.writeFile(wb, `ots_${new Date().toISOString().split('T')[0]}.xlsx`); }
        async function exportOTsPDF() { const { data } = await supabase.from('ordenes_trabajo').select('numero_ot, titulo, prioridad, estado'); const { jsPDF } = window.jspdf; const doc = new jsPDF('landscape'); doc.autoTable({ head: [['N° OT', 'TÍTULO', 'PRIORIDAD', 'ESTADO']], body: (data || []).map(ot => [ot.numero_ot, ot.titulo, ot.prioridad, ot.estado]), theme: 'striped', headStyles: { fillColor: [255,59,48] } }); doc.save(`ots_${new Date().toISOString().split('T')[0]}.pdf`); }
        async function exportActividadesExcel() { const { data } = await supabase.from('actividades_ot').select('descripcion, tecnico, estado, created_at, ordenes_trabajo(numero_ot)'); const exportData = (data || []).map(a => ({ OT: a.ordenes_trabajo?.numero_ot, Descripción: a.descripcion, Técnico: a.tecnico, Estado: a.estado, Fecha: new Date(a.created_at).toLocaleDateString() })); const ws = XLSX.utils.json_to_sheet(exportData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Actividades'); XLSX.writeFile(wb, `actividades_${new Date().toISOString().split('T')[0]}.xlsx`); }

        init();
    </script>
</body>
</html>
