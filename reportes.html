<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Reportes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo-area"><div class="logo-icon">🔧</div><div class="logo-text"><h1>INDUSTRIAL MS</h1><p>MAINTENANCE SYSTEM</p></div></div>
        <div class="nav-menu">
            <button class="nav-btn" onclick="location.href='dashboard.html'">📊 DASHBOARD</button>
            <button class="nav-btn" onclick="location.href='equipos.html'">🔌 EQUIPOS</button>
            <button class="nav-btn" onclick="location.href='ordenes.html'">📋 OT</button>
            <button class="nav-btn" onclick="location.href='actividades.html'">⏱️ ACTIVIDADES</button>
            <button class="nav-btn active" onclick="location.href='reportes.html'">📈 REPORTES</button>
            <button class="nav-btn" id="navUsuarios" style="display:none;" onclick="location.href='usuarios.html'">👥 USUARIOS</button>
            <button class="nav-btn logout-btn" id="logoutBtn">🚪 SALIR</button>
        </div>
        <div class="user-info"><div class="user-avatar">👤</div><div><div class="user-name" id="userName">Usuario</div><div class="user-role" id="userRol">ROL</div></div></div>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-title">📊 REPORTES</div>
            <div class="report-grid">
                <div class="report-card"><div class="report-icon">🔌</div><h3>EQUIPOS</h3><p>Catálogo de equipos</p><div class="report-buttons"><button class="btn btn-secondary btn-sm" onclick="exportarEquiposExcel()">📊 EXCEL</button><button class="btn btn-secondary btn-sm" onclick="exportarEquiposPDF()">📄 PDF</button></div></div>
                <div class="report-card"><div class="report-icon">📋</div><h3>ÓRDENES</h3><p>Todas las OT</p><div class="report-buttons"><button class="btn btn-secondary btn-sm" onclick="exportarOTsExcel()">📊 EXCEL</button><button class="btn btn-secondary btn-sm" onclick="exportarOTsPDF()">📄 PDF</button></div></div>
                <div class="report-card"><div class="report-icon">⏱️</div><h3>ACTIVIDADES</h3><p>Detalle de actividades</p><div class="report-buttons"><button class="btn btn-secondary btn-sm" onclick="exportarActividadesExcel()">📊 EXCEL</button></div></div>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            const { user, perfil } = await verificarSesion();
            if (!user) return;
            document.getElementById('userName').textContent = perfil?.nombre || 'Usuario';
            document.getElementById('userRol').textContent = perfil?.rol?.toUpperCase() || 'ROL';
            if (perfil?.rol === 'admin') document.getElementById('navUsuarios').style.display = 'block';
            document.getElementById('logoutBtn').onclick = logout;
        }

        async function exportarEquiposExcel() { const { data } = await supabase.from('equipos').select('*'); exportarExcel(data, 'equipos', 'Equipos'); }
        async function exportarEquiposPDF() { const { data } = await supabase.from('equipos').select('numero, nombre, codigo_completo, criticidad'); const body = (data || []).map(e => [e.numero, e.nombre, e.codigo_completo, e.criticidad]); exportarPDF(['N°', 'EQUIPO', 'CÓDIGO', 'CRITICIDAD'], body, 'equipos'); }
        async function exportarOTsExcel() { const { data } = await supabase.from('ordenes_trabajo').select('numero_ot, titulo, prioridad, estado, created_at'); exportarExcel(data, 'ordenes_trabajo', 'OTs'); }
        async function exportarOTsPDF() { const { data } = await supabase.from('ordenes_trabajo').select('numero_ot, titulo, prioridad, estado'); const body = (data || []).map(ot => [ot.numero_ot, ot.titulo, ot.prioridad, ot.estado]); exportarPDF(['N° OT', 'TÍTULO', 'PRIORIDAD', 'ESTADO'], body, 'ordenes_trabajo'); }
        async function exportarActividadesExcel() { const { data } = await supabase.from('actividades_ot').select('descripcion, tecnico, estado, created_at, ordenes_trabajo(numero_ot)'); const exportData = (data || []).map(a => ({ OT: a.ordenes_trabajo?.numero_ot, Descripción: a.descripcion, Técnico: a.tecnico, Estado: a.estado, Fecha: new Date(a.created_at).toLocaleDateString() })); exportarExcel(exportData, 'actividades', 'Actividades'); }

        init();
    </script>
</body>
</html>
