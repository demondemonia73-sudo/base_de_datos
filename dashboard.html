<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">🔧</div>
            <div class="logo-text">
                <h1>INDUSTRIAL MS</h1>
                <p>MAINTENANCE SYSTEM</p>
            </div>
        </div>
        <div class="nav-menu">
            <button class="nav-btn active" onclick="location.href='dashboard.html'">📊 DASHBOARD</button>
            <button class="nav-btn" onclick="location.href='equipos.html'">🔌 EQUIPOS</button>
            <button class="nav-btn" onclick="location.href='ordenes.html'">📋 OT</button>
            <button class="nav-btn" onclick="location.href='actividades.html'">⏱️ ACTIVIDADES</button>
            <button class="nav-btn" onclick="location.href='reportes.html'">📈 REPORTES</button>
            <button class="nav-btn logout-btn" id="logoutBtn">🚪 SALIR</button>
        </div>
        <div class="user-info">
            <div class="user-avatar">👤</div>
            <div class="user-details">
                <div class="user-name" id="userName">Usuario</div>
                <div class="user-role" id="userRol">ADMIN</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-label">TOTAL EQUIPOS</div>
                <div class="stat-value" id="totalEquipos">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚠️</div>
                <div class="stat-label">CRÍTICOS (A)</div>
                <div class="stat-value" id="equiposCriticos">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-label">OT PENDIENTES</div>
                <div class="stat-value" id="otsPendientes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-label">OT COMPLETADAS</div>
                <div class="stat-value" id="otsCompletadas">0</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📊 ÓRDENES POR ESTADO</div>
            <canvas id="estadosChart" style="max-height: 300px;"></canvas>
        </div>

        <div class="card">
            <div class="card-title">⚠️ EQUIPOS CRÍTICOS (CATEGORÍA A)</div>
            <div id="equiposCriticosList"></div>
        </div>
    </div>

    <script>
        let chart;

        async function init() {
            await verificarSesion();
            document.getElementById('logoutBtn').onclick = logout;
            await cargarDashboard();
        }

        async function cargarDashboard() {
            const { count: totalEquipos } = await supabase.from('equipos').select('*', { count: 'exact', head: true });
            const { count: equiposCriticos } = await supabase.from('equipos').select('*', { count: 'exact', head: true }).eq('criticidad', 'A');
            const { count: otsPendientes } = await supabase.from('ordenes_trabajo').select('*', { count: 'exact', head: true }).eq('estado', 'Pendiente');
            const inicioMes = new Date(); inicioMes.setDate(1);
            const { count: otsCompletadas } = await supabase.from('ordenes_trabajo').select('*', { count: 'exact', head: true }).eq('estado', 'Completada').gte('created_at', inicioMes.toISOString());

            document.getElementById('totalEquipos').textContent = totalEquipos || 0;
            document.getElementById('equiposCriticos').textContent = equiposCriticos || 0;
            document.getElementById('otsPendientes').textContent = otsPendientes || 0;
            document.getElementById('otsCompletadas').textContent = otsCompletadas || 0;

            const { data: estados } = await supabase.from('ordenes_trabajo').select('estado');
            const counts = { Pendiente: 0, 'En Progreso': 0, Completada: 0, Cancelada: 0 };
            estados?.forEach(ot => counts[ot.estado] = (counts[ot.estado] || 0) + 1);

            if (chart) chart.destroy();
            const ctx = document.getElementById('estadosChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Pendiente', 'En Progreso', 'Completada', 'Cancelada'],
                    datasets: [{
                        label: 'Órdenes',
                        data: [counts.Pendiente, counts['En Progreso'], counts.Completada, counts.Cancelada],
                        backgroundColor: ['#ffc107', '#ff3b30', '#28a745', '#6c757d'],
                        borderRadius: 8
                    }]
                },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#fff' } } } }
            });

            const { data: criticos } = await supabase.from('equipos').select('nombre, codigo_completo').eq('criticidad', 'A').limit(10);
            let html = '<table class="data-table"><thead><tr><th>EQUIPO</th><th>CÓDIGO</th><th>CRITICIDAD</th></tr></thead><tbody>';
            criticos?.forEach(e => html += `<tr><td>${e.nombre}</td><td>${e.codigo_completo}</td><td><span class="badge badge-critical">A</span></td></tr>`);
            html += '</tbody></table>';
            document.getElementById('equiposCriticosList').innerHTML = html || '<p style="color:#888;">Sin equipos críticos</p>';
        }

        init();
    </script>
</body>
</html>
