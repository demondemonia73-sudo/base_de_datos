<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Gestión de Usuarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
        }

        /* Header */
        .header {
            background: #0d0d0d;
            border-bottom: 1px solid #2a2a2a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff3b30, #c0392b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .logo-text h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .logo-text p {
            font-size: 10px;
            color: #ff3b30;
            letter-spacing: 2px;
        }
        .nav-menu {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid #2a2a2a;
            border-radius: 30px;
            color: #b0b0b0;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 13px;
        }
        .nav-btn:hover, .nav-btn.active {
            background: #ff3b30;
            border-color: #ff3b30;
            color: white;
        }
        .logout-btn {
            background: rgba(255,59,48,0.1);
            border-color: #ff3b30;
            color: #ff3b30;
        }
        .logout-btn:hover {
            background: #ff3b30;
            color: white;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #121212;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #2a2a2a;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: #ff3b30;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .user-name {
            font-weight: 600;
            font-size: 13px;
        }
        .user-role {
            font-size: 10px;
            color: #ff3b30;
        }

        /* Main Content */
        .main-content {
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cards */
        .card {
            background: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 32px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-left: 3px solid #ff3b30;
            padding-left: 12px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        /* Buttons */
        .btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #ff3b30, #c0392b);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(255,59,48,0.2);
        }
        .btn-secondary {
            background: #2a2a2a;
        }
        .btn-secondary:hover {
            background: #ff3b30;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 11px;
        }
        .btn-warning {
            background: #ffc107;
            color: #0a0a0a;
        }
        .btn-danger {
            background: #dc3545;
        }

        /* Formularios */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            font-size: 14px;
            color: #fff;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #ff3b30;
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th {
            text-align: left;
            padding: 12px 8px;
            color: #888;
            font-weight: 500;
            font-size: 12px;
            border-bottom: 1px solid #2a2a2a;
        }
        .data-table td {
            padding: 12px 8px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 13px;
        }

        /* Badges */
        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-admin { background: #ff3b30; color: white; }
        .badge-supervisor { background: #ffc107; color: #0a0a0a; }
        .badge-tecnico { background: #17a2b8; color: white; }
        .badge-operador { background: #6c757d; color: white; }
        .badge-visitante { background: #28a745; color: white; }
        .badge-active { background: #28a745; color: white; }
        .badge-inactive { background: #dc3545; color: white; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 32px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2a2a;
        }
        .modal-header h3 {
            font-size: 18px;
            color: #ff3b30;
        }
        .close-modal {
            cursor: pointer;
            font-size: 28px;
            color: #888;
        }
        .close-modal:hover {
            color: #ff3b30;
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            padding: 10px 16px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 30px;
            color: #fff;
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: stretch; }
            .main-content { padding: 20px; }
            .card-header { flex-direction: column; align-items: stretch; }
            .filter-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">👥</div>
            <div class="logo-text">
                <h1>INDUSTRIAL MS</h1>
                <p>USER MANAGEMENT</p>
            </div>
        </div>
        <div class="nav-menu">
            <button class="nav-btn" onclick="location.href='dashboard.html'">📊 DASHBOARD</button>
            <button class="nav-btn" onclick="location.href='equipos.html'">🔌 EQUIPOS</button>
            <button class="nav-btn" onclick="location.href='ordenes.html'">📋 OT</button>
            <button class="nav-btn" onclick="location.href='actividades.html'">⏱️ ACTIVIDADES</button>
            <button class="nav-btn" onclick="location.href='reportes.html'">📈 REPORTES</button>
            <button class="nav-btn active" onclick="location.href='usuarios.html'">👥 USUARIOS</button>
            <button class="nav-btn logout-btn" id="logoutBtn">🚪 SALIR</button>
        </div>
        <div class="user-info">
            <div class="user-avatar">👤</div>
            <div>
                <div class="user-name" id="userName">Administrador</div>
                <div class="user-role" id="userRol">ADMIN</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-header">
                <div class="card-title">👥 GESTIÓN DE USUARIOS</div>
                <button class="btn" onclick="openModal('userModal')">➕ NUEVO USUARIO</button>
            </div>
            <div class="filter-bar">
                <input type="text" id="searchUser" placeholder="🔍 Buscar por nombre o email..." onkeyup="filterUsers()">
                <select id="filterRol" onchange="filterUsers()">
                    <option value="">📊 TODOS LOS ROLES</option>
                    <option value="admin">👑 ADMINISTRADOR</option>
                    <option value="supervisor">📋 SUPERVISOR</option>
                    <option value="tecnico">🔧 TÉCNICO</option>
                    <option value="operador">⚙️ OPERADOR</option>
                    <option value="visitante">👁️ VISITANTE</option>
                </select>
                <select id="filterStatus" onchange="filterUsers()">
                    <option value="">📊 TODOS LOS ESTADOS</option>
                    <option value="true">🟢 ACTIVOS</option>
                    <option value="false">🔴 INACTIVOS</option>
                </select>
                <button class="btn btn-secondary btn-sm" onclick="exportUsersExcel()">📊 EXPORTAR EXCEL</button>
            </div>
            <div id="usersTable"></div>
        </div>
    </div>

    <!-- Modal Crear/Editar Usuario -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">➕ NUEVO USUARIO</h3>
                <span class="close-modal" onclick="closeModal('userModal')">&times;</span>
            </div>
            <form id="userForm" onsubmit="event.preventDefault(); saveUser()">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label>📧 EMAIL *</label>
                    <input type="email" id="userEmail" required placeholder="usuario@empresa.com">
                </div>
                <div class="form-group">
                    <label>👤 NOMBRE COMPLETO *</label>
                    <input type="text" id="userNombre" required placeholder="Nombre del usuario">
                </div>
                <div class="form-group" id="passwordField">
                    <label>🔒 CONTRASEÑA *</label>
                    <input type="password" id="userPassword" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label>📋 ROL</label>
                    <select id="userRol">
                        <option value="admin">👑 ADMINISTRADOR - Acceso total</option>
                        <option value="supervisor">📋 SUPERVISOR - Gestiona OT y equipos</option>
                        <option value="tecnico">🔧 TÉCNICO - Ejecuta actividades</option>
                        <option value="operador">⚙️ OPERADOR - Solo visualización</option>
                        <option value="visitante">👁️ VISITANTE - Solo lectura básica</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>📞 TELÉFONO</label>
                    <input type="text" id="userTelefono" placeholder="Opcional">
                </div>
                <div class="form-group" id="statusField">
                    <label>🔘 ESTADO</label>
                    <select id="userActivo">
                        <option value="true">🟢 ACTIVO</option>
                        <option value="false">🔴 INACTIVO</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="width:100%;">💾 GUARDAR USUARIO</button>
            </form>
        </div>
    </div>

    <!-- Modal Reset Password -->
    <div id="resetModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔑 RESETEAR CONTRASEÑA</h3>
                <span class="close-modal" onclick="closeModal('resetModal')">&times;</span>
            </div>
            <p style="margin-bottom: 20px; color:#888;">Usuario: <strong id="resetUserName"></strong></p>
            <div class="form-group">
                <label>NUEVA CONTRASEÑA</label>
                <input type="password" id="resetPassword" placeholder="Nueva contraseña">
            </div>
            <div class="form-group">
                <label>CONFIRMAR CONTRASEÑA</label>
                <input type="password" id="confirmPassword" placeholder="Confirmar contraseña">
            </div>
            <button class="btn" onclick="resetPassword()">🔄 CAMBIAR CONTRASEÑA</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://inghjpgqahmceplasunr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-_MBMDKrs8qfUlwscp9phQ_V9w1TjYv';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let usersData = [];
        let currentUserRol = null;
        let currentUserId = null;

        // Logout
        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        // Verificar sesión y permisos
        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data: perfil } = await supabase.from('perfiles').select('nombre, rol, id').eq('id', session.user.id).single();
            if (perfil) {
                document.getElementById('userName').textContent = perfil.nombre || 'Administrador';
                document.getElementById('userRol').textContent = perfil.rol?.toUpperCase() || 'ADMIN';
                currentUserRol = perfil.rol;
                currentUserId = perfil.id;
            }
            
            // Solo admin puede gestionar usuarios
            if (currentUserRol !== 'admin') {
                alert('⚠️ Solo el administrador puede acceder a esta sección.');
                window.location.href = 'dashboard.html';
                return;
            }
            
            document.getElementById('logoutBtn').onclick = logout;
            await loadUsers();
        }

        // Cargar usuarios
        async function loadUsers() {
            const { data, error } = await supabase.from('perfiles').select('*').order('created_at', { ascending: false });
            if (error) console.error(error);
            usersData = data || [];
            renderUsers(usersData);
        }

        function renderUsers(users) {
            let html = '<table class="data-table"><thead><tr><th>USUARIO</th><th>EMAIL</th><th>ROL</th><th>ESTADO</th><th>FECHA CREACIÓN</th><th>ACCIONES</th></tr></thead><tbody>';
            users.forEach(u => {
                let rolClass = u.rol === 'admin' ? 'badge-admin' : (u.rol === 'supervisor' ? 'badge-supervisor' : (u.rol === 'tecnico' ? 'badge-tecnico' : (u.rol === 'operador' ? 'badge-operador' : 'badge-visitante')));
                let rolName = u.rol === 'admin' ? '👑 ADMIN' : (u.rol === 'supervisor' ? '📋 SUPERVISOR' : (u.rol === 'tecnico' ? '🔧 TÉCNICO' : (u.rol === 'operador' ? '⚙️ OPERADOR' : '👁️ VISITANTE')));
                let statusClass = u.activo ? 'badge-active' : 'badge-inactive';
                let statusText = u.activo ? '🟢 ACTIVO' : '🔴 INACTIVO';
                
                html += `<tr>
                    <td><strong>${u.nombre || '-'}</strong></td>
                    <td>${u.email || '-'}</td>
                    <td><span class="badge ${rolClass}">${rolName}</span></td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                    <td>${new Date(u.created_at).toLocaleDateString()}</td>
                    <td class="action-buttons">
                        <button class="btn btn-secondary btn-sm" onclick="editUser('${u.id}')">✏️</button>
                        <button class="btn btn-warning btn-sm" onclick="openResetModal('${u.id}', '${u.nombre}')">🔑</button>
                        <button class="btn btn-danger btn-sm" onclick="toggleUserStatus('${u.id}', ${!u.activo})">${u.activo ? '🔴' : '🟢'}</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></tr>';
            document.getElementById('usersTable').innerHTML = html || '<p style="color:#888;">No hay usuarios registrados</p>';
        }

        function filterUsers() {
            const search = document.getElementById('searchUser').value.toLowerCase();
            const rol = document.getElementById('filterRol').value;
            const status = document.getElementById('filterStatus').value;
            
            let filtered = usersData;
            if (search) filtered = filtered.filter(u => u.nombre?.toLowerCase().includes(search) || u.email?.toLowerCase().includes(search));
            if (rol) filtered = filtered.filter(u => u.rol === rol);
            if (status !== '') filtered = filtered.filter(u => u.activo === (status === 'true'));
            renderUsers(filtered);
        }

        // Abrir modal para crear usuario
        function openModal() {
            document.getElementById('modalTitle').textContent = '➕ NUEVO USUARIO';
            document.getElementById('userId').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userNombre').value = '';
            document.getElementById('userPassword').value = '';
            document.getElementById('userRol').value = 'operador';
            document.getElementById('userTelefono').value = '';
            document.getElementById('userActivo').value = 'true';
            document.getElementById('passwordField').style.display = 'block';
            document.getElementById('statusField').style.display = 'block';
            document.getElementById('userModal').style.display = 'flex';
        }

        // Editar usuario
        async function editUser(id) {
            const user = usersData.find(u => u.id === id);
            if (!user) return;
            
            document.getElementById('modalTitle').textContent = '✏️ EDITAR USUARIO';
            document.getElementById('userId').value = user.id;
            document.getElementById('userEmail').value = user.email;
            document.getElementById('userNombre').value = user.nombre || '';
            document.getElementById('userRol').value = user.rol;
            document.getElementById('userTelefono').value = user.telefono || '';
            document.getElementById('userActivo').value = user.activo ? 'true' : 'false';
            document.getElementById('passwordField').style.display = 'none';
            document.getElementById('statusField').style.display = 'block';
            document.getElementById('userModal').style.display = 'flex';
        }

        // Guardar usuario
        async function saveUser() {
            const id = document.getElementById('userId').value;
            const email = document.getElementById('userEmail').value;
            const nombre = document.getElementById('userNombre').value;
            const rol = document.getElementById('userRol').value;
            const telefono = document.getElementById('userTelefono').value;
            const activo = document.getElementById('userActivo').value === 'true';
            const password = document.getElementById('userPassword').value;
            
            if (!email || !nombre) {
                alert('Complete los campos obligatorios');
                return;
            }
            
            try {
                if (id) {
                    // Actualizar usuario existente
                    const { error } = await supabase.from('perfiles').update({
                        nombre, rol, telefono, activo, updated_at: new Date()
                    }).eq('id', id);
                    if (error) throw error;
                    alert('✅ Usuario actualizado correctamente');
                } else {
                    // Crear nuevo usuario
                    if (!password || password.length < 6) {
                        alert('La contraseña debe tener al menos 6 caracteres');
                        return;
                    }
                    
                    // Crear en auth.users
                    const { data: authData, error: authError } = await supabase.auth.signUp({
                        email, password,
                        options: { data: { nombre, rol } }
                    });
                    if (authError) throw authError;
                    
                    // Crear perfil
                    const { error: perfilError } = await supabase.from('perfiles').insert({
                        id: authData.user.id, email, nombre, rol, telefono, activo: true
                    });
                    if (perfilError) throw perfilError;
                    
                    alert('✅ Usuario creado correctamente');
                }
                closeModal('userModal');
                await loadUsers();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // Abrir modal para resetear contraseña
        function openResetModal(userId, userName) {
            document.getElementById('resetUserName').textContent = userName;
            document.getElementById('resetPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            window.resetUserId = userId;
            document.getElementById('resetModal').style.display = 'flex';
        }

        // Resetear contraseña
        async function resetPassword() {
            const password = document.getElementById('resetPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            
            if (!password || password !== confirm) {
                alert('Las contraseñas no coinciden');
                return;
            }
            if (password.length < 6) {
                alert('La contraseña debe tener al menos 6 caracteres');
                return;
            }
            
            try {
                const { error } = await supabase.auth.admin.updateUserById(window.resetUserId, { password });
                if (error) throw error;
                alert('✅ Contraseña actualizada correctamente');
                closeModal('resetModal');
            } catch (error) {
                alert('❌ Error: ' + error.message + '\n Nota: Para cambiar contraseñas usa el panel de Supabase');
            }
        }

        // Activar/Desactivar usuario
        async function toggleUserStatus(userId, newStatus) {
            const action = newStatus ? 'activar' : 'desactivar';
            if (confirm(`¿${action} este usuario?`)) {
                const { error } = await supabase.from('perfiles').update({ activo: newStatus }).eq('id', userId);
                if (error) alert('Error: ' + error.message);
                else { await loadUsers(); }
            }
        }

        // Exportar usuarios a Excel
        async function exportUsersExcel() {
            const exportData = usersData.map(u => ({
                'Nombre': u.nombre,
                'Email': u.email,
                'Rol': u.rol?.toUpperCase(),
                'Teléfono': u.telefono,
                'Estado': u.activo ? 'ACTIVO' : 'INACTIVO',
                'Fecha Creación': new Date(u.created_at).toLocaleDateString()
            }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Usuarios');
            XLSX.writeFile(wb, `usuarios_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; };
        
        init();
    </script>
</body>
</html>
