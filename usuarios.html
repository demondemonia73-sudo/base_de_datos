<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS — Usuarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
</head>
<body>

<header class="header">
    <div class="logo-area">
        <div class="logo-icon">👥</div>
        <div class="logo-text"><h1>INDUSTRIAL MS</h1><p>MAINTENANCE SYSTEM</p></div>
    </div>
    <nav class="nav-menu">
        <button class="nav-btn" onclick="location.href='dashboard.html'">📊 Dashboard</button>
        <button class="nav-btn" onclick="location.href='equipos.html'">🔌 Equipos</button>
        <button class="nav-btn" onclick="location.href='ordenes.html'">📋 Órdenes</button>
        <button class="nav-btn" onclick="location.href='actividades.html'">⏱ Actividades</button>
        <button class="nav-btn" onclick="location.href='reportes.html'">📈 Reportes</button>
        <button class="nav-btn active" onclick="location.href='usuarios.html'">👥 Usuarios</button>
        <button class="nav-btn logout-btn" id="logoutBtn">🚪 Salir</button>
    </nav>
    <div class="user-info">
        <div class="user-avatar">👤</div>
        <div><div class="user-name" id="userName">—</div><div class="user-role" id="userRol">—</div></div>
    </div>
</header>

<main class="main-content">

    <div class="page-header">
        <div>
            <div class="page-title">Gestión de Usuarios</div>
            <div class="page-subtitle" id="usersCount">Solo visible para administradores</div>
        </div>
        <!-- Llama a abrirNuevo() para limpiar el formulario antes de abrir -->
        <button class="btn" onclick="abrirNuevo()">➕ Nuevo Usuario</button>
    </div>

    <div class="card">
        <div class="filter-bar">
            <input type="text" id="searchUser" placeholder="🔍 Buscar por nombre o email..." oninput="filtrar()">
            <select id="filterRol" onchange="filtrar()">
                <option value="">Todos los roles</option>
                <option value="admin">👑 Admin</option>
                <option value="supervisor">📋 Supervisor</option>
                <option value="tecnico">🔧 Técnico</option>
                <option value="operador">⚙️ Operador</option>
                <option value="visitante">👁 Visitante</option>
            </select>
            <select id="filterStatus" onchange="filtrar()">
                <option value="">Todos</option>
                <option value="true">🟢 Activos</option>
                <option value="false">🔴 Inactivos</option>
            </select>
            <button class="btn btn-secondary btn-sm" onclick="doExportarExcel()">📊 Excel</button>
        </div>
        <div class="table-wrapper" id="usersTable">
            <div class="empty-state"><div class="empty-icon">👥</div><p>Cargando usuarios...</p></div>
        </div>
    </div>

</main>

<!-- ===== MODAL: Crear / Editar Usuario ===== -->
<div id="modalUsuario" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalUserTitle">➕ Nuevo Usuario</h3>
            <span class="close-modal" onclick="closeModal('modalUsuario')">✕</span>
        </div>
        <input type="hidden" id="userId">

        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="userEmail" placeholder="correo@empresa.com">
        </div>
        <div class="form-group">
            <label>Nombre *</label>
            <input type="text" id="userNombre" placeholder="Nombre completo">
        </div>
        <!-- Contraseña solo para nuevo usuario -->
        <div class="form-group" id="fieldPassword">
            <label>Contraseña * (mín. 6 caracteres)</label>
            <input type="password" id="userPassword" placeholder="••••••••">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Rol</label>
                <select id="userRolSel">
                    <option value="admin">Admin</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="tecnico">Técnico</option>
                    <option value="operador" selected>Operador</option>
                    <option value="visitante">Visitante</option>
                </select>
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" id="userTelefono" placeholder="+591 ...">
            </div>
        </div>
        <!-- Estado solo para edición -->
        <div class="form-group" id="fieldActivo" style="display:none;">
            <label>Estado</label>
            <select id="userActivo">
                <option value="true">🟢 Activo</option>
                <option value="false">🔴 Inactivo</option>
            </select>
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
            <button class="btn btn-secondary" onclick="closeModal('modalUsuario')">Cancelar</button>
            <button class="btn" onclick="submitUsuario()">Guardar</button>
        </div>
    </div>
</div>

<!-- ===== MODAL: Cambiar Contraseña ===== -->
<div id="modalCambiarPwd" class="modal">
    <div class="modal-content" style="max-width:420px;">
        <div class="modal-header">
            <h3>🔑 Cambiar Contraseña</h3>
            <span class="close-modal" onclick="closeModal('modalCambiarPwd')">✕</span>
        </div>
        <input type="hidden" id="pwdUserId">
        <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">
            Cambiando contraseña de: <strong id="pwdUserNombre" style="color:var(--text-primary);"></strong>
        </p>
        <div class="form-group">
            <label>Nueva Contraseña *</label>
            <div class="password-wrapper">
                <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres">
                <button type="button" class="toggle-password" onclick="
                    const i = document.getElementById('newPassword');
                    i.type = i.type==='password'?'text':'password';
                    this.textContent = i.type==='password'?'👁':'🙈';
                ">👁</button>
            </div>
        </div>
        <div class="form-group">
            <label>Confirmar Nueva Contraseña *</label>
            <input type="password" id="confirmPassword" placeholder="Repita la contraseña">
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
            <button class="btn btn-secondary" onclick="closeModal('modalCambiarPwd')">Cancelar</button>
            <button class="btn" onclick="submitCambiarPwd()">Actualizar Contraseña</button>
        </div>
    </div>
</div>

<script>
    let _usuarios = [];

    async function init() {
        const result = await verificarSesion();
        if (!result) return;
        if (result.perfil?.rol !== 'admin') {
            mostrarToast('Acceso restringido a administradores', 'error');
            setTimeout(() => window.location.href = 'dashboard.html', 1500);
            return;
        }
        document.getElementById('userName').textContent = result.perfil?.nombre || 'Admin';
        document.getElementById('userRol').textContent  = 'ADMIN';
        document.getElementById('logoutBtn').onclick = logout;
        await loadUsuarios();
    }

    async function loadUsuarios() {
        try {
            _usuarios = await cargarUsuarios();
            document.getElementById('usersCount').textContent = `${_usuarios.length} usuarios registrados`;
            renderizar(_usuarios);
        } catch (err) {
            mostrarToast('Error cargando usuarios: ' + err.message, 'error');
        }
    }

    function renderizar(lista) {
        if (!lista.length) {
            document.getElementById('usersTable').innerHTML =
                '<div class="empty-state"><div class="empty-icon">🔍</div><p>No se encontraron usuarios</p></div>';
            return;
        }

        const rolBadge = (r) => {
            const map = { admin:'badge-admin', supervisor:'badge-supervisor', tecnico:'badge-tecnico', operador:'badge-operador', visitante:'badge-visitante' };
            return `<span class="badge ${map[r] || 'badge-operador'}">${r?.toUpperCase() || '—'}</span>`;
        };

        let html = `<table class="data-table">
            <thead><tr>
                <th>Nombre</th><th>Email</th><th>Rol</th><th>Contraseña</th>
                <th>Estado</th><th>Registro</th><th>Acciones</th>
            </tr></thead><tbody>`;

        lista.forEach(u => {
            // Contraseña visible del admin (de credenciales_admin)
            const cred = u.credenciales_admin?.[0];
            const pwdVisible = cred?.password_visible || '—';
            const pwdDate = cred?.updated_at ? formatFecha(cred.updated_at) : '';

            html += `<tr>
                <td><strong>${u.nombre || '—'}</strong></td>
                <td style="color:var(--text-secondary);font-size:12px;">${u.email}</td>
                <td>${rolBadge(u.rol)}</td>
                <td>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <code id="pwd-${u.id}" style="filter:blur(4px);cursor:pointer;transition:filter 0.2s;"
                            onclick="this.style.filter='none'"
                            title="Clic para ver">${pwdVisible}</code>
                        ${pwdDate ? `<span style="font-size:10px;color:var(--text-muted);">${pwdDate}</span>` : ''}
                    </div>
                </td>
                <td>${u.activo
                    ? '<span class="badge badge-active">ACTIVO</span>'
                    : '<span class="badge badge-inactive">INACTIVO</span>'}</td>
                <td style="color:var(--text-muted);font-size:12px;">${formatFecha(u.created_at)}</td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-icon btn-edit"   onclick="abrirEditar('${u.id}')" title="Editar datos">✏️</button>
                        <button class="btn-icon btn-view"   onclick="abrirCambiarPwd('${u.id}', '${u.nombre}')" title="Cambiar contraseña">🔑</button>
                        <button class="btn-icon btn-toggle" onclick="toggleActivo('${u.id}', ${!u.activo})"
                            title="${u.activo ? 'Desactivar' : 'Activar'}">${u.activo ? '🔴' : '🟢'}</button>
                        <button class="btn-icon btn-delete" onclick="doEliminarUsuario('${u.id}', '${u.nombre}')" title="Eliminar usuario">🗑</button>
                    </div>
                </td>
            </tr>`;
        });

        document.getElementById('usersTable').innerHTML = html + '</tbody></table>';
    }

    function filtrar() {
        const q  = document.getElementById('searchUser').value.toLowerCase();
        const r  = document.getElementById('filterRol').value;
        const st = document.getElementById('filterStatus').value;

        let res = _usuarios;
        if (q)  res = res.filter(u => u.nombre?.toLowerCase().includes(q) || u.email?.toLowerCase().includes(q));
        if (r)  res = res.filter(u => u.rol === r);
        if (st !== '') res = res.filter(u => u.activo === (st === 'true'));
        renderizar(res);
    }

    // Abre modal limpio para CREAR
    function abrirNuevo() {
        document.getElementById('modalUserTitle').textContent = '➕ Nuevo Usuario';
        document.getElementById('userId').value       = '';
        document.getElementById('userEmail').value    = '';
        document.getElementById('userNombre').value   = '';
        document.getElementById('userPassword').value = '';
        document.getElementById('userRolSel').value   = 'operador';
        document.getElementById('userTelefono').value = '';
        document.getElementById('userActivo').value   = 'true';
        document.getElementById('userEmail').disabled = false;
        document.getElementById('fieldPassword').style.display = 'block';
        document.getElementById('fieldActivo').style.display   = 'none';
        openModal('modalUsuario');
    }

    // Abre modal con datos para EDITAR
    function abrirEditar(id) {
        const u = _usuarios.find(x => x.id === id);
        if (!u) return;
        document.getElementById('modalUserTitle').textContent = '✏️ Editar Usuario';
        document.getElementById('userId').value       = u.id;
        document.getElementById('userEmail').value    = u.email;
        document.getElementById('userNombre').value   = u.nombre || '';
        document.getElementById('userRolSel').value   = u.rol;
        document.getElementById('userTelefono').value = u.telefono || '';
        document.getElementById('userActivo').value   = u.activo ? 'true' : 'false';
        document.getElementById('userEmail').disabled = true;   // email no se edita
        document.getElementById('fieldPassword').style.display = 'none';
        document.getElementById('fieldActivo').style.display   = 'block';
        openModal('modalUsuario');
    }

    async function submitUsuario() {
        const id     = document.getElementById('userId').value;
        const email  = document.getElementById('userEmail').value.trim();
        const nombre = document.getElementById('userNombre').value.trim();
        const rol    = document.getElementById('userRolSel').value;
        const tel    = document.getElementById('userTelefono').value.trim();

        if (!email || !nombre) { mostrarToast('Email y nombre son obligatorios', 'warning'); return; }

        try {
            if (id) {
                // Editar
                const activo = document.getElementById('userActivo').value === 'true';
                await actualizarUsuario(id, { nombre, rol, telefono: tel || null, activo });
                mostrarToast('Usuario actualizado correctamente', 'success');
            } else {
                // Crear
                const pwd = document.getElementById('userPassword').value;
                if (!pwd || pwd.length < 6) { mostrarToast('Contraseña mínimo 6 caracteres', 'warning'); return; }
                await crearUsuario(email, pwd, nombre, rol, tel);
                mostrarToast('Usuario creado. Revise el email de confirmación.', 'success');
            }
            closeModal('modalUsuario');
            await loadUsuarios();
        } catch (err) {
            mostrarToast('Error: ' + err.message, 'error');
        }
    }

    async function toggleActivo(id, nuevoEstado) {
        const u = _usuarios.find(x => x.id === id);
        const accion = nuevoEstado ? 'activar' : 'desactivar';
        if (!confirm(`¿Desea ${accion} al usuario ${u?.nombre}?`)) return;
        try {
            await actualizarUsuario(id, { activo: nuevoEstado });
            mostrarToast(`Usuario ${nuevoEstado ? 'activado' : 'desactivado'}`, 'success');
            await loadUsuarios();
        } catch (err) {
            mostrarToast('Error: ' + err.message, 'error');
        }
    }

    async function doEliminarUsuario(id, nombre) {
        if (!confirm(`¿Eliminar permanentemente al usuario "${nombre}"?\nEsta acción no se puede deshacer.`)) return;
        try {
            await eliminarUsuario(id);
            mostrarToast(`Usuario ${nombre} eliminado`, 'success');
            await loadUsuarios();
        } catch (err) {
            mostrarToast('Error: ' + err.message, 'error');
        }
    }

    async function doExportarExcel() {
        const data = _usuarios.map(u => ({
            Nombre:    u.nombre,
            Email:     u.email,
            Rol:       u.rol?.toUpperCase(),
            Teléfono:  u.telefono || '—',
            Estado:    u.activo ? 'ACTIVO' : 'INACTIVO',
            Registro:  new Date(u.created_at).toLocaleDateString('es-ES'),
        }));
        await exportarExcel(data, 'usuarios', 'Usuarios');
    }

    function abrirCambiarPwd(id, nombre) {
        document.getElementById('pwdUserId').value       = id;
        document.getElementById('pwdUserNombre').textContent = nombre;
        document.getElementById('newPassword').value     = '';
        document.getElementById('confirmPassword').value = '';
        openModal('modalCambiarPwd');
    }

    async function submitCambiarPwd() {
        const id  = document.getElementById('pwdUserId').value;
        const pwd = document.getElementById('newPassword').value;
        const pwd2 = document.getElementById('confirmPassword').value;

        if (!pwd || pwd.length < 6) {
            mostrarToast('La contraseña debe tener mínimo 6 caracteres', 'warning'); return;
        }
        if (pwd !== pwd2) {
            mostrarToast('Las contraseñas no coinciden', 'warning'); return;
        }

        try {
            await cambiarPasswordAdmin(id, pwd);
            mostrarToast('Contraseña actualizada correctamente', 'success');
            closeModal('modalCambiarPwd');
            await loadUsuarios();
        } catch (err) {
            mostrarToast('Error: ' + err.message, 'error');
        }
    }

    init();
</script>
</body>
</html>
