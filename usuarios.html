<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Usuarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .action-buttons { display: flex; gap: 6px; }
        .btn-sm { padding: 6px 12px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-area"><div class="logo-icon">👥</div><div class="logo-text"><h1>INDUSTRIAL MS</h1><p>USER MANAGEMENT</p></div></div>
        <div class="nav-menu">
            <button class="nav-btn" onclick="location.href='dashboard.html'">📊 DASHBOARD</button>
            <button class="nav-btn" onclick="location.href='equipos.html'">🔌 EQUIPOS</button>
            <button class="nav-btn" onclick="location.href='ordenes.html'">📋 OT</button>
            <button class="nav-btn" onclick="location.href='actividades.html'">⏱️ ACTIVIDADES</button>
            <button class="nav-btn" onclick="location.href='reportes.html'">📈 REPORTES</button>
            <button class="nav-btn active" onclick="location.href='usuarios.html'">👥 USUARIOS</button>
            <button class="nav-btn logout-btn" id="logoutBtn">🚪 SALIR</button>
        </div>
        <div class="user-info"><div class="user-avatar">👤</div><div><div class="user-name" id="userName">Admin</div><div class="user-role" id="userRol">ADMIN</div></div></div>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-header"><div class="card-title">👥 USUARIOS</div><button class="btn" onclick="openModal()">➕ NUEVO</button></div>
            <div class="filter-bar">
                <input type="text" id="searchUser" placeholder="🔍 Buscar..." onkeyup="filterUsers()">
                <select id="filterRol" onchange="filterUsers()"><option value="">📊 TODOS</option><option value="admin">👑 ADMIN</option><option value="supervisor">📋 SUPERVISOR</option><option value="tecnico">🔧 TÉCNICO</option><option value="operador">⚙️ OPERADOR</option><option value="visitante">👁️ VISITANTE</option></select>
                <select id="filterStatus" onchange="filterUsers()"><option value="">📊 TODOS</option><option value="true">🟢 ACTIVOS</option><option value="false">🔴 INACTIVOS</option></select>
                <button class="btn btn-secondary btn-sm" onclick="exportUsersExcel()">📊 EXCEL</button>
            </div>
            <div id="usersTable"></div>
        </div>
    </div>

    <div id="userModal" class="modal"><div class="modal-content">
        <div class="modal-header"><h3 id="modalTitle">➕ NUEVO USUARIO</h3><span class="close-modal" onclick="closeModal('userModal')">&times;</span></div>
        <form id="userForm" onsubmit="event.preventDefault(); saveUser()">
            <input type="hidden" id="userId">
            <div class="form-group"><label>📧 EMAIL</label><input type="email" id="userEmail" required></div>
            <div class="form-group"><label>👤 NOMBRE</label><input type="text" id="userNombre" required></div>
            <div class="form-group" id="passwordField"><label>🔒 CONTRASEÑA</label><input type="password" id="userPassword" placeholder="Mínimo 6 caracteres"></div>
            <div class="form-group"><label>📋 ROL</label><select id="userRol"><option value="admin">ADMIN</option><option value="supervisor">SUPERVISOR</option><option value="tecnico">TÉCNICO</option><option value="operador">OPERADOR</option><option value="visitante">VISITANTE</option></select></div>
            <div class="form-group"><label>📞 TELÉFONO</label><input type="text" id="userTelefono"></div>
            <div class="form-group" id="statusField"><label>🔘 ESTADO</label><select id="userActivo"><option value="true">ACTIVO</option><option value="false">INACTIVO</option></select></div>
            <button type="submit" class="btn">GUARDAR</button>
        </form>
    </div></div>

    <script src="config.js"></script>
    <script>
        let usersData = [], currentUserRol = null;

        async function logout() { await supabase.auth.signOut(); window.location.href = 'index.html'; }

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            const { data: perfil } = await supabase.from('perfiles').select('nombre, rol').eq('id', session.user.id).single();
            if (perfil) {
                document.getElementById('userName').textContent = perfil.nombre;
                document.getElementById('userRol').textContent = perfil.rol?.toUpperCase();
                currentUserRol = perfil.rol;
            }
            if (currentUserRol !== 'admin') { alert('Solo administradores'); window.location.href = 'dashboard.html'; return; }
            document.getElementById('logoutBtn').onclick = logout;
            await loadUsers();
        }

        async function loadUsers() {
            const { data } = await supabase.from('perfiles').select('*').order('created_at', { ascending: false });
            usersData = data || [];
            renderUsers(usersData);
        }

        function renderUsers(users) {
            let html = '<table class="data-table"><thead><tr><th>NOMBRE</th><th>EMAIL</th><th>ROL</th><th>ESTADO</th><th>FECHA</th><th>ACCIONES</th></tr></thead><tbody>';
            users.forEach(u => {
                let rolClass = u.rol === 'admin' ? 'badge-admin' : (u.rol === 'supervisor' ? 'badge-supervisor' : (u.rol === 'tecnico' ? 'badge-tecnico' : (u.rol === 'operador' ? 'badge-operador' : 'badge-visitante')));
                let rolName = u.rol === 'admin' ? 'ADMIN' : (u.rol === 'supervisor' ? 'SUPERVISOR' : (u.rol === 'tecnico' ? 'TÉCNICO' : (u.rol === 'operador' ? 'OPERADOR' : 'VISITANTE')));
                html += `<tr>
                    <td><strong>${u.nombre || '-'}</strong></td>
                    <td>${u.email}</td>
                    <td><span class="badge ${rolClass}">${rolName}</span></td>
                    <td><span class="badge ${u.activo ? 'badge-active' : 'badge-inactive'}">${u.activo ? 'ACTIVO' : 'INACTIVO'}</span></td>
                    <td>${new Date(u.created_at).toLocaleDateString()}</td>
                    <td class="action-buttons"><button class="btn btn-secondary btn-sm" onclick="editUser('${u.id}')">✏️</button><button class="btn btn-warning btn-sm" onclick="openResetModal('${u.id}', '${u.nombre}')">🔑</button><button class="btn btn-danger btn-sm" onclick="toggleUserStatus('${u.id}', ${!u.activo})">${u.activo ? '🔴' : '🟢'}</button></td>
                </tr>`);
            });
            html += '</tbody></table>';
            document.getElementById('usersTable').innerHTML = html || '<p>No hay usuarios</p>';
        }

        function filterUsers() {
            let filtered = usersData;
            const search = document.getElementById('searchUser').value.toLowerCase();
            if (search) filtered = filtered.filter(u => u.nombre?.toLowerCase().includes(search) || u.email?.toLowerCase().includes(search));
            const rol = document.getElementById('filterRol').value;
            if (rol) filtered = filtered.filter(u => u.rol === rol);
            const status = document.getElementById('filterStatus').value;
            if (status !== '') filtered = filtered.filter(u => u.activo === (status === 'true'));
            renderUsers(filtered);
        }

        function openModal() {
            document.getElementById('modalTitle').textContent = '➕ NUEVO USUARIO';
            document.getElementById('userId').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userNombre').value = '';
            document.getElementById('userPassword').value = '';
            document.getElementById('userRol').value = 'operador';
            document.getElementById('userTelefono').value = '';
            document.getElementById('userActivo').value = 'true';
            document.getElementById('passwordField').style.display = 'block';
            document.getElementById('statusField').style.display = 'block';
            document.getElementById('userModal').style.display = 'flex';
        }

        async function editUser(id) {
            const user = usersData.find(u => u.id === id);
            if (!user) return;
            document.getElementById('modalTitle').textContent = '✏️ EDITAR USUARIO';
            document.getElementById('userId').value = user.id;
            document.getElementById('userEmail').value = user.email;
            document.getElementById('userNombre').value = user.nombre || '';
            document.getElementById('userRol').value = user.rol;
            document.getElementById('userTelefono').value = user.telefono || '';
            document.getElementById('userActivo').value = user.activo ? 'true' : 'false';
            document.getElementById('passwordField').style.display = 'none';
            document.getElementById('statusField').style.display = 'block';
            document.getElementById('userModal').style.display = 'flex';
        }

        async function saveUser() {
            const id = document.getElementById('userId').value;
            const email = document.getElementById('userEmail').value;
            const nombre = document.getElementById('userNombre').value;
            const rol = document.getElementById('userRol').value;
            const telefono = document.getElementById('userTelefono').value;
            const activo = document.getElementById('userActivo').value === 'true';
            const password = document.getElementById('userPassword').value;
            if (!email || !nombre) { alert('Complete campos obligatorios'); return; }
            try {
                if (id) {
                    const { error } = await supabase.from('perfiles').update({ nombre, rol, telefono, activo }).eq('id', id);
                    if (error) throw error;
                    alert('Usuario actualizado');
                } else {
                    if (!password || password.length < 6) { alert('Contraseña mínimo 6 caracteres'); return; }
                    const { data: authData, error: authError } = await supabase.auth.signUp({ email, password, options: { data: { nombre, rol } } });
                    if (authError) throw authError;
                    await supabase.from('perfiles').insert({ id: authData.user.id, email, nombre, rol, telefono, activo: true });
                    alert('Usuario creado');
                }
                closeModal('userModal');
                await loadUsers();
            } catch (error) { alert('Error: ' + error.message); }
        }

        function openResetModal(userId, userName) {
            window.resetUserId = userId;
            alert(`Para cambiar contraseña de ${userName}, use el panel de Supabase Authentication`);
        }

        async function toggleUserStatus(userId, newStatus) {
            if (confirm(`${newStatus ? 'Activar' : 'Desactivar'} usuario?`)) {
                await supabase.from('perfiles').update({ activo: newStatus }).eq('id', userId);
                await loadUsers();
            }
        }

        function exportUsersExcel() {
            const data = usersData.map(u => ({ Nombre: u.nombre, Email: u.email, Rol: u.rol?.toUpperCase(), Teléfono: u.telefono, Estado: u.activo ? 'ACTIVO' : 'INACTIVO', Fecha: new Date(u.created_at).toLocaleDateString() }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Usuarios');
            XLSX.writeFile(wb, `usuarios_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; };

        init();
    </script>
</body>
</html>
