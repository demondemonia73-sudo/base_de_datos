<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { width: 100%; padding-right: 50px; }
        .toggle-password { position: absolute; right: 16px; background: none; border: none; color: #666; cursor: pointer; font-size: 18px; }
        .test-credentials { margin-top: 24px; padding: 16px; background: #0d0d0d; border-radius: 12px; text-align: center; font-size: 12px; color: #666; }
        .test-credentials span { color: #ff3b30; font-weight: 600; }
        .clear-btn { background: #6c757d; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-icon">🔧</div>
                <h1>INDUSTRIAL MS</h1>
                <p class="login-subtitle">Sistema de Gestión de Mantenimiento</p>
            </div>

            <div id="statusCard" class="status-card">
                <div class="status-title">🔌 ESTADO DEL SISTEMA</div>
                <div class="status-text" id="connectionStatus">⏳ Conectando...</div>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <div class="form-group">
                <label>USUARIO</label>
                <input type="email" id="loginEmail" placeholder="admin@industrial.com">
            </div>

            <div class="form-group">
                <label>CONTRASEÑA</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••">
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
            </div>

            <button class="btn" id="loginBtn">ACCEDER AL SISTEMA</button>
            <button class="btn btn-secondary" id="forceBtn">🔌 FORZAR CONEXIÓN</button>
            <button class="btn clear-btn" id="clearBtn">🗑️ LIMPIAR SESIÓN</button>

            <div class="test-credentials">
                🔑 <strong>Usuarios de prueba</strong><br>
                👑 admin@industrial.com / Admin123456<br>
                📋 supervisor@industrial.com / Supervisor123<br>
                🔧 tecnico@industrial.com / Tecnico123
            </div>
        </div>
    </div>

    <script>
        // Definir variable global para Supabase
        let supabase;

        // Inicializar Supabase
        function initSupabase() {
            const SUPABASE_URL = 'https://inghjpgqahmceplasunr.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_-_MBMDKrs8qfUlwscp9phQ_V9w1TjYv';
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase inicializado');
            return supabase;
        }

        // Elementos DOM
        const loginBtn = document.getElementById('loginBtn');
        const forceBtn = document.getElementById('forceBtn');
        const clearBtn = document.getElementById('clearBtn');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const connectionStatus = document.getElementById('connectionStatus');
        const togglePassword = document.getElementById('togglePassword');

        // Toggle password
        if (togglePassword) {
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
            });
        }

        // Probar conexión
        async function testConnection() {
            if (!supabase) initSupabase();
            connectionStatus.innerHTML = '🔄 Probando conexión...';
            try {
                const { error } = await supabase.from('perfiles').select('count', { count: 'exact', head: true });
                if (error) throw error;
                connectionStatus.innerHTML = '✅ CONECTADO | Supabase Online';
                connectionStatus.style.color = '#4caf50';
                return true;
            } catch (error) {
                connectionStatus.innerHTML = '⚠️ ERROR DE CONEXIÓN';
                connectionStatus.style.color = '#ff3b30';
                return false;
            }
        }

        // Limpiar sesión
        async function clearSession() {
            if (!supabase) initSupabase();
            connectionStatus.innerHTML = '🔄 Limpiando sesión...';
            localStorage.clear();
            sessionStorage.clear();
            try {
                await supabase.auth.signOut();
            } catch(e) {}
            connectionStatus.innerHTML = '✅ Sesión limpiada. Recargando...';
            setTimeout(() => window.location.reload(), 1000);
        }

        // Login
        async function doLogin(email, password) {
            if (!supabase) initSupabase();
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                
                const { data: perfil } = await supabase.from('perfiles').select('nombre, rol').eq('id', data.user.id).single();
                if (!perfil) throw new Error('Perfil no encontrado');
                
                successDiv.textContent = `✅ Bienvenido ${perfil.nombre}. Redirigiendo...`;
                successDiv.style.display = 'block';
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            } catch (err) {
                errorDiv.textContent = `❌ ${err.message === 'Invalid login credentials' ? 'Credenciales incorrectas' : err.message}`;
                errorDiv.style.display = 'block';
            }
        }

        // Eventos
        loginBtn.onclick = () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                errorDiv.textContent = '❌ Complete todos los campos';
                errorDiv.style.display = 'block';
                return;
            }
            doLogin(email, password);
        };
        forceBtn.onclick = testConnection;
        clearBtn.onclick = clearSession;
        
        // Valores por defecto
        emailInput.value = 'admin@industrial.com';
        passwordInput.value = 'Admin123456';
        
        // Inicializar y verificar sesión
        initSupabase();
        
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'dashboard.html';
        });
        
        testConnection();
        
        // Exponer funciones para consola
        window.testConnection = testConnection;
        window.clearSession = clearSession;
    </script>
</body>
</html>
