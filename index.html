<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS — Acceso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <div class="login-icon">🔧</div>
            <div class="login-title">INDUSTRIAL MS</div>
            <div class="login-subtitle">Sistema de Gestión de Mantenimiento</div>
        </div>

        <div class="status-card">
            <div class="status-label">⬤ ESTADO DEL SISTEMA</div>
            <div class="status-text" id="connectionStatus">Conectando...</div>
        </div>

        <div id="msgError"   class="msg msg-error"></div>
        <div id="msgSuccess" class="msg msg-success"></div>

        <div class="form-group">
            <label>Usuario</label>
            <input type="email" id="loginEmail" placeholder="correo@empresa.com" autocomplete="username">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="toggle-password" id="togglePwd" aria-label="Mostrar contraseña">👁</button>
            </div>
        </div>

        <button class="btn" id="loginBtn" style="width:100%; justify-content:center;">
            Acceder al Sistema
        </button>

        <div class="demo-creds">
            <strong>USUARIOS DE PRUEBA</strong><br>
            👑 admin@industrial.com / Admin123456<br>
            📋 supervisor@industrial.com / Supervisor123<br>
            🔧 tecnico@industrial.com / Tecnico123
        </div>
    </div>
</div>

<script>
    // Verificar si ya hay sesión activa
    window.db.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = 'dashboard.html';
    });

    // Test de conexión
    (async () => {
        const el = document.getElementById('connectionStatus');
        try {
            const { error } = await window.db.from('perfiles').select('count', { count: 'exact', head: true });
            if (error) throw error;
            el.textContent = '✓ Conectado — Supabase Online';
            el.style.color = '#4ade80';
        } catch {
            el.textContent = '✕ Error de conexión';
            el.style.color = '#f87171';
        }
    })();

    // Toggle contraseña
    document.getElementById('togglePwd').addEventListener('click', () => {
        const input = document.getElementById('loginPassword');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        document.getElementById('togglePwd').textContent = show ? '🙈' : '👁';
    });

    // Login
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errEl    = document.getElementById('msgError');
        const okEl     = document.getElementById('msgSuccess');

        errEl.style.display = 'none';
        okEl.style.display  = 'none';

        if (!email || !password) {
            errEl.textContent = 'Complete usuario y contraseña.';
            errEl.style.display = 'block';
            return;
        }

        const btn = document.getElementById('loginBtn');
        btn.textContent = 'Verificando...';
        btn.disabled = true;

        try {
            const { data, error } = await window.db.auth.signInWithPassword({ email, password });
            if (error) throw error;

            const { data: perfil, error: perfilErr } = await supabase
                .from('perfiles').select('nombre, rol').eq('id', data.user.id).single();
            if (perfilErr || !perfil) throw new Error('Perfil no encontrado. Contacte al administrador.');

            okEl.textContent = `✓ Bienvenido, ${perfil.nombre}. Redirigiendo...`;
            okEl.style.display = 'block';
            setTimeout(() => window.location.href = 'dashboard.html', 800);
        } catch (err) {
            const msg = err.message === 'Invalid login credentials'
                ? 'Credenciales incorrectas. Verifique usuario y contraseña.'
                : err.message;
            errEl.textContent = msg;
            errEl.style.display = 'block';
            btn.textContent = 'Acceder al Sistema';
            btn.disabled = false;
        }
    });

    // Enter para login
    document.getElementById('loginPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
</script>
</body>
</html>
