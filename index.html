<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Mantenimiento</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .login-card .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .password-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
            background: none;
            border: none;
            font-size: 20px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            display: none;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
            text-align: center;
        }
        .test-credentials {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        .test-credentials span {
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>🔧 Sistema de Mantenimiento</h1>
            <p class="subtitle">Control de Equipos y Órdenes de Trabajo</p>
            
            <div id="loginError" class="error-message"></div>
            <div id="loginSuccess" class="success-message"></div>
            <div id="loginInfo" class="info-message"></div>
            <div id="loadingMessage" class="loading">⏳ Verificando credenciales...</div>
            
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="usuario@empresa.com" autocomplete="email">
            </div>
            
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword" title="Mostrar/Ocultar contraseña">👁️</button>
                </div>
            </div>
            
            <button class="btn" id="loginBtn">Ingresar al Sistema</button>
            
            <div class="test-credentials">
                📋 <strong>Credenciales de prueba:</strong><br>
                Email: <span>admin@demo.com</span> | Contraseña: <span>Admin123456</span>
            </div>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const SUPABASE_URL = 'https://inghjpgqahmceplasunr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-_MBMDKrs8qfUlwscp9phQ_V9w1TjYv';
        
        // Inicializar Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Elementos del DOM
        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const errorDiv = document.getElementById('loginError');
        const successDiv = document.getElementById('loginSuccess');
        const infoDiv = document.getElementById('loginInfo');
        const loadingDiv = document.getElementById('loadingMessage');
        const togglePassword = document.getElementById('togglePassword');

        // Mostrar/Ocultar contraseña
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Función de login
        async function login() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Ocultar mensajes anteriores
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            infoDiv.style.display = 'none';
            
            // Validar campos
            if (!email) {
                errorDiv.textContent = '❌ Por favor ingrese su email';
                errorDiv.style.display = 'block';
                emailInput.focus();
                return;
            }
            
            if (!password) {
                errorDiv.textContent = '❌ Por favor ingrese su contraseña';
                errorDiv.style.display = 'block';
                passwordInput.focus();
                return;
            }

            // Validar formato de email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorDiv.textContent = '❌ El formato del email no es válido';
                errorDiv.style.display = 'block';
                return;
            }

            // Mostrar loading
            loadingDiv.style.display = 'block';
            loginBtn.disabled = true;
            loginBtn.textContent = '🔄 Verificando...';

            try {
                // Intentar login
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    loadingDiv.style.display = 'none';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Ingresar al Sistema';
                    
                    if (error.message === 'Invalid login credentials') {
                        errorDiv.innerHTML = '❌ <strong>Email o contraseña incorrectos</strong><br>Verifique sus credenciales o contacte al administrador.';
                        errorDiv.style.display = 'block';
                        
                        // Mostrar credenciales de ayuda
                        infoDiv.innerHTML = '💡 <strong>Credenciales válidas:</strong> admin@demo.com / Admin123456';
                        infoDiv.style.display = 'block';
                    } else if (error.message.includes('Email not confirmed')) {
                        errorDiv.textContent = '❌ Su email no ha sido confirmado. Revise su bandeja de entrada.';
                        errorDiv.style.display = 'block';
                    } else {
                        errorDiv.textContent = '❌ Error: ' + error.message;
                        errorDiv.style.display = 'block';
                    }
                    return;
                }

                if (data?.user) {
                    // Verificar si tiene perfil
                    const { data: perfil, error: perfilError } = await supabase
                        .from('perfiles')
                        .select('rol, nombre')
                        .eq('id', data.user.id)
                        .single();

                    if (perfilError) {
                        loadingDiv.style.display = 'none';
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Ingresar al Sistema';
                        errorDiv.innerHTML = '⚠️ <strong>Usuario sin perfil asignado</strong><br>Contacte al administrador para activar su cuenta.';
                        errorDiv.style.display = 'block';
                        await supabase.auth.signOut();
                        return;
                    }

                    // Login exitoso
                    successDiv.innerHTML = '✅ <strong>¡Bienvenido ' + (perfil.nombre || 'Usuario') + '!</strong><br>Redirigiendo al panel principal...';
                    successDiv.style.display = 'block';
                    loadingDiv.style.display = 'none';
                    
                    // Redirigir al dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }

            } catch (err) {
                loadingDiv.style.display = 'none';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Ingresar al Sistema';
                errorDiv.textContent = '❌ Error de conexión: ' + err.message;
                errorDiv.style.display = 'block';
                console.error('Error de conexión:', err);
            }
        }

        // Verificar si ya hay sesión activa
        async function checkSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    // Verificar que el perfil existe
                    const { data: perfil } = await supabase
                        .from('perfiles')
                        .select('id')
                        .eq('id', session.user.id)
                        .single();
                    
                    if (perfil) {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch (err) {
                console.log('No hay sesión activa');
            }
        }

        // Eventos
        loginBtn.onclick = login;
        emailInput.onkeypress = (e) => { if (e.key === 'Enter') login(); };
        passwordInput.onkeypress = (e) => { if (e.key === 'Enter') login(); };

        // Auto-completar credenciales de prueba (opcional)
        emailInput.value = 'admin@demo.com';
        passwordInput.value = 'Admin123456';

        // Iniciar
        checkSession();
    </script>
</body>
</html>
