<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login + Pruebas - Sistema de Mantenimiento</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .login-card .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .password-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            font-size: 18px;
            background: none;
            border: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #ddd;
        }
        .status-connected {
            border-left-color: #28a745;
            background: #d4edda;
        }
        .status-disconnected {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        .status-testing {
            border-left-color: #ffc107;
            background: #fff3cd;
        }
        .status-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .console-log {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        .console-log p {
            margin: 5px 0;
            border-bottom: 1px solid #333;
            padding: 5px 0;
        }
        .console-log .success { color: #4ec9b0; }
        .console-log .error { color: #f48771; }
        .console-log .info { color: #9cdcfe; }
        .test-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-test {
            background: #6c757d;
            font-size: 12px;
            padding: 8px;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .loading {
            text-align: center;
            margin: 15px 0;
            color: #667eea;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>🔧 Sistema de Mantenimiento</h1>
            <p class="subtitle">Panel de Control de Equipos</p>
            
            <!-- Estado de conexión -->
            <div id="connectionStatus" class="status-card status-testing">
                <div class="status-title">🔌 Estado de conexión:</div>
                <div id="connectionText">🔄 Probando conexión con Supabase...</div>
            </div>
            
            <!-- Mensajes -->
            <div id="loginError" class="error-message"></div>
            <div id="loginSuccess" class="success-message"></div>
            <div id="loadingMessage" class="loading">⏳ Procesando...</div>
            
            <!-- Formulario -->
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="admin@demo.com">
            </div>
            
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••">
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
            </div>
            
            <button class="btn" id="loginBtn">Ingresar al Sistema</button>
            
            <!-- Botones de prueba -->
            <div class="test-buttons">
                <button class="btn btn-test" id="testLoginBtn">🧪 Probar Login (Consola)</button>
                <button class="btn btn-test" id="testConnectionBtn">🔍 Probar Conexión</button>
            </div>
            
            <!-- Consola de logs -->
            <div class="console-log" id="consoleLog">
                <p class="info">📋 [Sistema] Inicializando...</p>
            </div>
            
            <div class="test-credentials" style="margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 10px; font-size: 12px; text-align: center;">
                📋 <strong>Credenciales de prueba:</strong> admin@demo.com / Admin123456
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // CONFIGURACIÓN
        // =====================================================
        const SUPABASE_URL = 'https://inghjpgqahmceplasunr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-_MBMDKrs8qfUlwscp9phQ_V9w1TjYv';
        
        // Inicializar Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Elementos DOM
        const loginBtn = document.getElementById('loginBtn');
        const testLoginBtn = document.getElementById('testLoginBtn');
        const testConnectionBtn = document.getElementById('testConnectionBtn');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const errorDiv = document.getElementById('loginError');
        const successDiv = document.getElementById('loginSuccess');
        const loadingDiv = document.getElementById('loadingMessage');
        const togglePassword = document.getElementById('togglePassword');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionText = document.getElementById('connectionText');
        const consoleLog = document.getElementById('consoleLog');

        // Función para agregar mensajes a la consola visual
        function addConsoleMessage(message, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            const timestamp = new Date().toLocaleTimeString();
            p.innerHTML = `[${timestamp}] ${message}`;
            consoleLog.appendChild(p);
            p.scrollIntoView({ behavior: 'smooth', block: 'end' });
            
            // También mostrar en consola real
            if (type === 'error') console.error(message);
            else if (type === 'success') console.log('✅', message);
            else console.log('📋', message);
        }

        // Probar conexión a Supabase
        async function testConnection() {
            addConsoleMessage('🔄 Probando conexión a Supabase...', 'info');
            connectionStatus.className = 'status-card status-testing';
            connectionText.innerHTML = '🔄 Probando conexión con Supabase...';
            
            try {
                // Probar conexión haciendo una consulta simple
                const { data, error } = await supabase.from('perfiles').select('count', { count: 'exact', head: true });
                
                if (error) {
                    throw error;
                }
                
                connectionStatus.className = 'status-card status-connected';
                connectionText.innerHTML = '✅ Conectado a Supabase correctamente';
                addConsoleMessage('✅ Conexión exitosa a Supabase', 'success');
                
                // Probar tabla equipos
                const { count: equiposCount } = await supabase.from('equipos').select('*', { count: 'exact', head: true });
                addConsoleMessage(`📊 Tabla "equipos" tiene ${equiposCount || 0} registros`, equiposCount > 0 ? 'success' : 'info');
                
                // Probar tabla ordenes_trabajo
                const { count: otsCount } = await supabase.from('ordenes_trabajo').select('*', { count: 'exact', head: true });
                addConsoleMessage(`📊 Tabla "ordenes_trabajo" tiene ${otsCount || 0} registros`, otsCount > 0 ? 'success' : 'info');
                
                return true;
                
            } catch (error) {
                connectionStatus.className = 'status-card status-disconnected';
                connectionText.innerHTML = '❌ Error de conexión: ' + error.message;
                addConsoleMessage(`❌ Error de conexión: ${error.message}`, 'error');
                return false;
            }
        }

        // Función de login con logs detallados
        async function doLogin(email, password, fromTest = false) {
            addConsoleMessage(`🔐 Intentando login con email: ${email}`, 'info');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            
            if (fromTest) {
                addConsoleMessage('🧪 MODO PRUEBA: Ejecutando login de prueba...', 'info');
            }
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    loadingDiv.style.display = 'none';
                    addConsoleMessage(`❌ Error de autenticación: ${error.message}`, 'error');
                    errorDiv.textContent = `❌ ${error.message}`;
                    errorDiv.style.display = 'block';
                    return false;
                }
                
                addConsoleMessage(`✅ Autenticación exitosa para usuario: ${data.user.email}`, 'success');
                addConsoleMessage(`🆔 User ID: ${data.user.id}`, 'info');
                
                // Verificar perfil
                const { data: perfil, error: perfilError } = await supabase
                    .from('perfiles')
                    .select('rol, nombre')
                    .eq('id', data.user.id)
                    .single();
                
                if (perfilError) {
                    addConsoleMessage(`⚠️ Usuario sin perfil: ${perfilError.message}`, 'error');
                    errorDiv.textContent = '⚠️ Usuario sin perfil asignado';
                    errorDiv.style.display = 'block';
                    await supabase.auth.signOut();
                    loadingDiv.style.display = 'none';
                    return false;
                }
                
                addConsoleMessage(`👤 Perfil encontrado: ${perfil.nombre} (${perfil.rol})`, 'success');
                
                successDiv.textContent = `✅ ¡Bienvenido ${perfil.nombre}! Redirigiendo...`;
                successDiv.style.display = 'block';
                loadingDiv.style.display = 'none';
                
                addConsoleMessage('🚀 Redirigiendo al dashboard...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
                return true;
                
            } catch (err) {
                loadingDiv.style.display = 'none';
                addConsoleMessage(`❌ Error inesperado: ${err.message}`, 'error');
                errorDiv.textContent = `❌ Error: ${err.message}`;
                errorDiv.style.display = 'block';
                return false;
            }
        }

        // Login desde el formulario
        async function login() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                errorDiv.textContent = '❌ Ingrese email y contraseña';
                errorDiv.style.display = 'block';
                addConsoleMessage('❌ Campos vacíos: email o contraseña no ingresados', 'error');
                return;
            }
            
            await doLogin(email, password, false);
        }

        // Prueba desde consola
        async function testLogin() {
            addConsoleMessage('🧪 === INICIANDO PRUEBA DE LOGIN ===', 'info');
            const testEmail = 'admin@demo.com';
            const testPassword = 'Admin123456';
            
            addConsoleMessage(`📧 Email de prueba: ${testEmail}`, 'info');
            addConsoleMessage(`🔑 Contraseña de prueba: ${testPassword}`, 'info');
            
            await doLogin(testEmail, testPassword, true);
        }

        // Verificar sesión existente
        async function checkSession() {
            addConsoleMessage('🔍 Verificando sesión existente...', 'info');
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                addConsoleMessage(`✅ Sesión encontrada para: ${session.user.email}`, 'success');
                const { data: perfil } = await supabase
                    .from('perfiles')
                    .select('id')
                    .eq('id', session.user.id)
                    .single();
                
                if (perfil) {
                    addConsoleMessage('🚀 Redirigiendo al dashboard por sesión activa...', 'success');
                    window.location.href = 'dashboard.html';
                }
            } else {
                addConsoleMessage('ℹ️ No hay sesión activa', 'info');
            }
        }

        // Configurar eventos
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
            addConsoleMessage(`${type === 'text' ? 'Mostrando' : 'Ocultando'} contraseña`, 'info');
        });
        
        loginBtn.onclick = login;
        testLoginBtn.onclick = testLogin;
        testConnectionBtn.onclick = testConnection;
        
        emailInput.onkeypress = (e) => { if (e.key === 'Enter') login(); };
        passwordInput.onkeypress = (e) => { if (e.key === 'Enter') login(); };
        
        // Auto-completar credenciales
        emailInput.value = 'admin@demo.com';
        passwordInput.value = 'Admin123456';
        
        // Inicializar
        addConsoleMessage('🚀 Sistema inicializado', 'success');
        addConsoleMessage(`🔗 Supabase URL: ${SUPABASE_URL}`, 'info');
        
        // Probar conexión automáticamente
        setTimeout(async () => {
            await testConnection();
            await checkSession();
        }, 500);
        
        // Exponer funciones para probar desde consola
        window.testLogin = testLogin;
        window.testConnection = testConnection;
        window.supabaseClient = supabase;
        
        addConsoleMessage('💡 Puedes probar desde la consola con: testLogin() o testConnection()', 'info');
    </script>
</body>
</html>
