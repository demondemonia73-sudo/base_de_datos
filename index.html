<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
    <style>
        /* Estilos específicos para login */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(45deg, rgba(255,59,48,0.03) 0px, rgba(255,59,48,0.03) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
        }
        .login-card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }
        .login-card:hover {
            border-color: #ff3b30;
            box-shadow: 0 0 30px rgba(255,59,48,0.1);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff3b30, #c0392b);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255,59,48,0.3);
        }
        .login-card h1 {
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .login-subtitle {
            color: #888;
            text-align: center;
            font-size: 13px;
            margin-bottom: 32px;
        }
        .status-card {
            background: #0d0d0d;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
            border-left: 3px solid #ff3b30;
        }
        .status-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .status-text {
            font-size: 13px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-icon">🔧</div>
                <h1>INDUSTRIAL MS</h1>
                <p class="login-subtitle">Sistema de Gestión de Mantenimiento</p>
            </div>

            <div id="statusCard" class="status-card">
                <div class="status-title">🔌 ESTADO DEL SISTEMA</div>
                <div class="status-text" id="connectionStatus">Inicializando conexión...</div>
            </div>

            <div id="loginError" class="error-message"></div>
            <div id="loginSuccess" class="success-message"></div>
            <div id="loadingMessage" class="loading">⏳ Autenticando credenciales...</div>

            <div class="form-group">
                <label>USUARIO</label>
                <input type="email" id="loginEmail" placeholder="admin@demo.com">
            </div>

            <div class="form-group">
                <label>CONTRASEÑA</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••">
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
            </div>

            <button class="btn" id="loginBtn" style="width: 100%;">ACCEDER AL SISTEMA</button>

            <div class="test-credentials">
                🔑 <strong>Acceso de prueba</strong><br>
                📧 <span>admin@demo.com</span> &nbsp;|&nbsp; 🔒 <span>Admin123456</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const loginBtn = document.getElementById('loginBtn');
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');
            const loadingDiv = document.getElementById('loadingMessage');
            const togglePassword = document.getElementById('togglePassword');
            const connectionStatus = document.getElementById('connectionStatus');

            // Toggle password
            if (togglePassword) {
                togglePassword.addEventListener('click', () => {
                    const type = passwordInput.type === 'password' ? 'text' : 'password';
                    passwordInput.type = type;
                    togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
                });
            }

            // Test connection
            async function testConnection() {
                try {
                    const { error } = await supabase.from('perfiles').select('count', { count: 'exact', head: true });
                    if (error) throw error;
                    connectionStatus.innerHTML = '✅ SISTEMA CONECTADO | Supabase Online';
                    connectionStatus.style.color = '#4caf50';
                    return true;
                } catch (error) {
                    connectionStatus.innerHTML = '⚠️ ERROR DE CONEXIÓN | Verificar red';
                    connectionStatus.style.color = '#ff3b30';
                    return false;
                }
            }

            // Login function
            async function doLogin(email, password) {
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
                loadingDiv.style.display = 'block';
                loginBtn.disabled = true;

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;

                    const { data: perfil, error: perfilError } = await supabase
                        .from('perfiles')
                        .select('nombre, rol')
                        .eq('id', data.user.id)
                        .single();

                    if (perfilError) throw new Error('Perfil no encontrado');

                    successDiv.style.display = 'block';
                    successDiv.textContent = `✅ Bienvenido ${perfil.nombre}. Redirigiendo al panel...`;
                    loadingDiv.style.display = 'none';
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);

                } catch (err) {
                    errorDiv.textContent = `❌ ${err.message === 'Invalid login credentials' ? 'Credenciales incorrectas' : err.message}`;
                    errorDiv.style.display = 'block';
                    loadingDiv.style.display = 'none';
                    loginBtn.disabled = false;
                }
            }

            // Event listeners
            loginBtn.onclick = () => {
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                if (!email || !password) {
                    errorDiv.textContent = '❌ Complete todos los campos';
                    errorDiv.style.display = 'block';
                    return;
                }
                doLogin(email, password);
            };

            emailInput.onkeypress = (e) => { if (e.key === 'Enter') loginBtn.click(); };
            passwordInput.onkeypress = (e) => { if (e.key === 'Enter') loginBtn.click(); };

            // Auto-fill
            emailInput.value = 'admin@demo.com';
            passwordInput.value = 'Admin123456';

            // Check existing session
            supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) window.location.href = 'dashboard.html';
            });

            testConnection();

            // Expose for console testing
            window.testConnection = testConnection;
        })();
    </script>
</body>
</html>
