<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Mantenimiento</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .login-card .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            display: none;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>🔧 Sistema de Mantenimiento</h1>
            <p class="subtitle">Control de Equipos y Órdenes de Trabajo</p>
            <div id="loginError" class="error-message"></div>
            <div id="loginSuccess" class="success-message"></div>
            <div id="loadingMessage" class="loading">⏳ Verificando...</div>
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="admin@demo.com">
            </div>
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="btn" id="loginBtn">Ingresar al Sistema</button>
        </div>
    </div>

    <script>
        // Configuración
        const SUPABASE_URL = 'https://inghjpgqahmceplasunr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-_MBMDKrs8qfUlwscp9phQ_V9w1TjYv';
        
        // Inicializar Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Elementos del DOM
        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const errorDiv = document.getElementById('loginError');
        const successDiv = document.getElementById('loginSuccess');
        const loadingDiv = document.getElementById('loadingMessage');

        // Función de login
        async function login() {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Ocultar mensajes anteriores
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Validar campos
            if (!email || !password) {
                errorDiv.textContent = '❌ Ingrese email y contraseña';
                errorDiv.style.display = 'block';
                return;
            }

            // Mostrar loading
            loadingDiv.style.display = 'block';
            loginBtn.disabled = true;

            try {
                // Intentar login
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    if (error.message === 'Invalid login credentials') {
                        errorDiv.textContent = '❌ Email o contraseña incorrectos. Use: admin@demo.com / Admin123456';
                    } else {
                        errorDiv.textContent = '❌ Error: ' + error.message;
                    }
                    errorDiv.style.display = 'block';
                    loadingDiv.style.display = 'none';
                    loginBtn.disabled = false;
                    return;
                }

                if (data?.user) {
                    // Verificar si tiene perfil
                    const { data: perfil, error: perfilError } = await supabase
                        .from('perfiles')
                        .select('rol, nombre')
                        .eq('id', data.user.id)
                        .single();

                    if (perfilError) {
                        errorDiv.textContent = '⚠️ Usuario sin perfil asignado. Contacte al administrador.';
                        errorDiv.style.display = 'block';
                        await supabase.auth.signOut();
                        loadingDiv.style.display = 'none';
                        loginBtn.disabled = false;
                        return;
                    }

                    // Login exitoso
                    successDiv.textContent = '✅ Login exitoso! Redirigiendo...';
                    successDiv.style.display = 'block';
                    
                    // Redirigir al dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                }

            } catch (err) {
                errorDiv.textContent = '❌ Error de conexión: ' + err.message;
                errorDiv.style.display = 'block';
                loadingDiv.style.display = 'none';
                loginBtn.disabled = false;
            }
        }

        // Verificar si ya hay sesión activa
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        }

        // Eventos
        loginBtn.onclick = login;
        emailInput.onkeypress = (e) => { if (e.key === 'Enter') login(); };
        passwordInput.onkeypress = (e) => { if (e.key === 'Enter') login(); };

        // Iniciar
        checkSession();
    </script>
</body>
</html>
