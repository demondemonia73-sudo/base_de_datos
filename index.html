<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-icon">🔧</div>
                <h1>INDUSTRIAL MS</h1>
                <p class="login-subtitle">Sistema de Gestión de Mantenimiento</p>
            </div>

            <div id="statusCard" class="status-card">
                <div class="status-title">🔌 ESTADO DEL SISTEMA</div>
                <div class="status-text" id="connectionStatus">⏳ Conectando...</div>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <div class="form-group">
                <label>USUARIO</label>
                <input type="email" id="loginEmail" placeholder="admin@industrial.com">
            </div>

            <div class="form-group">
                <label>CONTRASEÑA</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••">
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
            </div>

            <button class="btn" id="loginBtn">ACCEDER AL SISTEMA</button>

            <div class="test-credentials">
                🔑 <strong>Usuarios de prueba</strong><br>
                👑 admin@industrial.com / Admin123456<br>
                📋 supervisor@industrial.com / Supervisor123<br>
                🔧 tecnico@industrial.com / Tecnico123
            </div>
        </div>
    </div>

    <script>
        // Test connection
        async function testConnection() {
            const statusDiv = document.getElementById('connectionStatus');
            statusDiv.innerHTML = '🔄 Probando conexión...';
            try {
                const { error } = await supabase.from('perfiles').select('count', { count: 'exact', head: true });
                if (error) throw error;
                statusDiv.innerHTML = '✅ CONECTADO | Supabase Online';
                statusDiv.style.color = '#4caf50';
                return true;
            } catch (error) {
                statusDiv.innerHTML = '⚠️ ERROR DE CONEXIÓN';
                statusDiv.style.color = '#ff3b30';
                return false;
            }
        }

        // Toggle password
        document.getElementById('togglePassword').addEventListener('click', () => {
            const input = document.getElementById('loginPassword');
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
            document.getElementById('togglePassword').textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Login
        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (!email || !password) {
                errorDiv.textContent = '❌ Complete todos los campos';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                
                const { data: perfil } = await supabase.from('perfiles').select('nombre, rol').eq('id', data.user.id).single();
                if (!perfil) throw new Error('Perfil no encontrado');
                
                successDiv.textContent = `✅ Bienvenido ${perfil.nombre}. Redirigiendo...`;
                successDiv.style.display = 'block';
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            } catch (err) {
                errorDiv.textContent = `❌ ${err.message === 'Invalid login credentials' ? 'Credenciales incorrectas' : err.message}`;
                errorDiv.style.display = 'block';
            }
        };
        
        document.getElementById('loginEmail').value = 'admin@industrial.com';
        document.getElementById('loginPassword').value = 'Admin123456';
        
        // Check existing session
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'dashboard.html';
        });
        
        testConnection();
    </script>
</body>
</html>
