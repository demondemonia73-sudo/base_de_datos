<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Mantenimiento</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .login-card .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loginPage" class="login-container">
        <div class="login-card">
            <h1>🔧 Sistema de Mantenimiento</h1>
            <p class="subtitle">Control de Equipos y Órdenes de Trabajo</p>
            <div id="loginError" class="error-message"></div>
            <div id="loadingMessage" class="loading">⏳ Verificando usuario...</div>
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="admin@demo.com" value="admin@demo.com">
            </div>
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••" value="Admin123456">
            </div>
            <button class="btn" onclick="login()">Ingresar al Sistema</button>
        </div>
    </div>

    <script>
        let supabase;

        async function init() {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            // Verificar si ya hay sesión activa
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            const loadingDiv = document.getElementById('loadingMessage');

            errorDiv.style.display = 'none';
            
            if (!email || !password) {
                errorDiv.textContent = 'Ingrese email y contraseña';
                errorDiv.style.display = 'block';
                return;
            }

            loadingDiv.style.display = 'block';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                loadingDiv.style.display = 'none';

                if (error) {
                    if (error.message === 'Invalid login credentials') {
                        errorDiv.textContent = '❌ Email o contraseña incorrectos. Usuario: admin@demo.com / Contraseña: Admin123456';
                    } else {
                        errorDiv.textContent = '❌ Error: ' + error.message;
                    }
                    errorDiv.style.display = 'block';
                    return;
                }

                if (data?.user) {
                    // Verificar si tiene perfil en la tabla perfiles
                    const { data: perfil, error: perfilError } = await supabase
                        .from('perfiles')
                        .select('rol')
                        .eq('id', data.user.id)
                        .single();

                    if (perfilError && perfilError.code === 'PGRST116') {
                        errorDiv.textContent = '⚠️ Usuario válido pero sin perfil asignado. Contacte al administrador.';
                        errorDiv.style.display = 'block';
                        await supabase.auth.signOut();
                        return;
                    }

                    // Redirigir al dashboard
                    window.location.href = 'dashboard.html';
                }

            } catch (err) {
                loadingDiv.style.display = 'none';
                errorDiv.textContent = '❌ Error de conexión: ' + err.message;
                errorDiv.style.display = 'block';
            }
        }

        init();
    </script>
</body>
</html>
