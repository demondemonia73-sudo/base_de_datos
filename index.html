<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS — Acceso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <div class="login-icon">🔧</div>
            <div class="login-title">INDUSTRIAL MS</div>
            <div class="login-subtitle">Sistema de Gestión de Mantenimiento</div>
        </div>

        <div class="status-card">
            <div class="status-label">⬤ ESTADO DEL SISTEMA</div>
            <div class="status-text" id="connectionStatus">Conectando...</div>
        </div>

        <div id="msgError"   class="msg msg-error"></div>
        <div id="msgSuccess" class="msg msg-success"></div>

        <div class="form-group">
            <label>Usuario o Email</label>
            <input type="text" id="loginEmail" placeholder="Carlos o correo@empresa.com" autocomplete="username">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="toggle-password" id="togglePwd" aria-label="Mostrar contraseña">👁</button>
            </div>
        </div>

        <button class="btn" id="loginBtn" style="width:100%; justify-content:center;">
            Acceder al Sistema
        </button>

        <div class="demo-creds">
            <strong>USUARIOS DE PRUEBA</strong><br>
            👑 admin@industrial.com / Admin123456<br>
            📋 supervisor@industrial.com / Supervisor123<br>
            🔧 tecnico@industrial.com / Tecnico123
        </div>
    </div>
</div>

<script>
    // Verificar kill switch antes de mostrar login
    (async () => {
        try {
            const { data } = await window.db
                .from('system_config')
                .select('value')
                .eq('key', 'kill_switch')
                .single();
            if (data?.value === 'true') {
                document.body.innerHTML = `
                    <div style="min-height:100vh;display:grid;place-items:center;background:#080808;font-family:'DM Sans',sans-serif;">
                        <div style="text-align:center;padding:40px;">
                            <div style="font-size:64px;margin-bottom:24px;">🔒</div>
                            <h1 style="color:#f0f0f0;font-size:28px;margin-bottom:12px;">Sistema en Mantenimiento</h1>
                            <p style="color:#888;font-size:14px;max-width:400px;margin:0 auto;">
                                El sistema se encuentra temporalmente fuera de servicio.<br>
                                Por favor contacte al administrador del sistema.
                            </p>
                            <div style="margin-top:32px;padding:12px 20px;background:#161616;border:1px solid #242424;border-radius:8px;display:inline-block;">
                                <span style="font-family:monospace;font-size:11px;color:#555;">INDUSTRIAL MS · SISTEMA BLOQUEADO</span>
                            </div>
                        </div>
                    </div>`;
                return;
            }
        } catch(e) { /* si no existe la tabla continuar normal */ }
    })();

    // Verificar si ya hay sesión activa
    window.db.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = 'dashboard.html';
    });

    // Test de conexión
    (async () => {
        const el = document.getElementById('connectionStatus');
        try {
            const { error } = await window.db.from('perfiles').select('count', { count: 'exact', head: true });
            if (error) throw error;
            el.textContent = '✓ Conectado — Supabase Online';
            el.style.color = '#4ade80';
        } catch {
            el.textContent = '✕ Error de conexión';
            el.style.color = '#f87171';
        }
    })();

    // Toggle contraseña
    document.getElementById('togglePwd').addEventListener('click', () => {
        const input = document.getElementById('loginPassword');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        document.getElementById('togglePwd').textContent = show ? '🙈' : '👁';
    });

    // Login
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const input    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errEl    = document.getElementById('msgError');
        const okEl     = document.getElementById('msgSuccess');

        errEl.style.display = 'none';
        okEl.style.display  = 'none';

        if (!input || !password) {
            errEl.textContent = 'Complete usuario y contraseña.';
            errEl.style.display = 'block';
            return;
        }

        const btn = document.getElementById('loginBtn');
        btn.textContent = 'Verificando...';
        btn.disabled = true;

        try {
            const { perfil } = await loginConNombreOEmail(input, password);
            okEl.textContent = `✓ Bienvenido, ${perfil.nombre}. Redirigiendo...`;
            okEl.style.display = 'block';
            setTimeout(() => window.location.href = 'dashboard.html', 800);
        } catch (err) {
            errEl.textContent = err.message;
            errEl.style.display = 'block';
            btn.textContent = 'Acceder al Sistema';
            btn.disabled = false;
        }
    });

    // Enter para login
    document.getElementById('loginPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
</script>
</body>
</html>
