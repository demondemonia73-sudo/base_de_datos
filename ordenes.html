<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Órdenes de Trabajo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">🔧</div>
            <div class="logo-text">
                <h1>INDUSTRIAL MS</h1>
                <p>MAINTENANCE SYSTEM</p>
            </div>
        </div>
        <div class="nav-menu">
            <button class="nav-btn" onclick="location.href='dashboard.html'">📊 DASHBOARD</button>
            <button class="nav-btn" onclick="location.href='equipos.html'">🔌 EQUIPOS</button>
            <button class="nav-btn active" onclick="location.href='ordenes.html'">📋 OT</button>
            <button class="nav-btn" onclick="location.href='actividades.html'">⏱️ ACTIVIDADES</button>
            <button class="nav-btn" onclick="location.href='reportes.html'">📈 REPORTES</button>
            <button class="nav-btn logout-btn" id="logoutBtn">🚪 SALIR</button>
        </div>
        <div class="user-info">
            <div class="user-avatar">👤</div>
            <div class="user-details">
                <div class="user-name" id="userName">Usuario</div>
                <div class="user-role" id="userRol">ADMIN</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-header">
                <div class="card-title">📋 ÓRDENES DE TRABAJO</div>
                <button class="btn" onclick="openModal('otModal')">➕ NUEVA OT</button>
            </div>
            <div class="filter-bar">
                <input type="text" id="searchOT" placeholder="🔍 Buscar OT..." onkeyup="filtrarOTs()">
                <select id="filterEstadoOT" onchange="filtrarOTs()">
                    <option value="">📊 TODOS LOS ESTADOS</option>
                    <option value="Pendiente">⏳ PENDIENTE</option>
                    <option value="En Progreso">🔄 EN PROGRESO</option>
                    <option value="Completada">✅ COMPLETADA</option>
                    <option value="Cancelada">❌ CANCELADA</option>
                </select>
            </div>
            <div id="otsTable"></div>
        </div>
    </div>

    <!-- Modal Nueva OT -->
    <div id="otModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>➕ NUEVA ORDEN DE TRABAJO</h3>
                <span class="close-modal" onclick="closeModal('otModal')">&times;</span>
            </div>
            <form id="otForm" onsubmit="event.preventDefault(); crearOT()">
                <div class="form-group">
                    <label>TÍTULO *</label>
                    <input type="text" id="otTitulo" required placeholder="Ej: Mantenimiento correctivo motor">
                </div>
                <div class="form-group">
                    <label>EQUIPO</label>
                    <select id="otEquipoId"></select>
                </div>
                <div class="form-group">
                    <label>DESCRIPCIÓN</label>
                    <textarea id="otDescripcion" rows="3" placeholder="Detalle de la intervención..."></textarea>
                </div>
                <div class="form-group">
                    <label>PRIORIDAD</label>
                    <select id="otPrioridad">
                        <option value="Baja">🟢 BAJA</option>
                        <option value="Normal" selected>🔵 NORMAL</option>
                        <option value="Alta">🟠 ALTA</option>
                        <option value="Urgente">🔴 URGENTE</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>TIPO DE MANTENIMIENTO</label>
                    <select id="otTipo">
                        <option value="Preventivo">🔧 PREVENTIVO</option>
                        <option value="Correctivo">🛠️ CORRECTIVO</option>
                        <option value="Predictivo">📊 PREDICTIVO</option>
                        <option value="Emergencia">🚨 EMERGENCIA</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="width:100%;">CREAR OT</button>
            </form>
        </div>
    </div>

    <!-- Modal Ver OT -->
    <div id="viewOTModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>👁️ DETALLE DE OT</h3>
                <span class="close-modal" onclick="closeModal('viewOTModal')">&times;</span>
            </div>
            <div id="viewOTContent"></div>
        </div>
    </div>

    <script>
        let otsData = [];

        async function init() {
            await verificarSesion();
            document.getElementById('logoutBtn').onclick = logout;
            await cargarOTs();
            await cargarSelectEquipos();
        }

        async function cargarOTs() {
            const { data, error } = await supabase.from('ordenes_trabajo').select(`*, equipos(nombre)`).order('id', { ascending: false });
            if (error) console.error(error);
            otsData = data || [];
            renderizarOTs(otsData);
        }

        function renderizarOTs(ots) {
            let html = '<table class="data-table"><thead><tr><th>N° OT</th><th>EQUIPO</th><th>TÍTULO</th><th>PRIORIDAD</th><th>ESTADO</th><th>FECHA</th><th>ACCIONES</th></tr></thead><tbody>';
            ots.forEach(ot => {
                let estadoClass = ot.estado === 'Pendiente' ? 'badge-pending' : (ot.estado === 'En Progreso' ? 'badge-progress' : (ot.estado === 'Completada' ? 'badge-completed' : 'badge-cancelled'));
                let prioridadClass = ot.prioridad === 'Urgente' ? 'badge-critical' : (ot.prioridad === 'Alta' ? 'badge-moderate' : 'badge-low');
                html += `<tr>
                    <td><strong>${ot.numero_ot || '-'}</strong></td>
                    <td>${ot.equipos?.nombre || ot.equipo_nombre || '-'}</td>
                    <td>${ot.titulo || '-'}</td>
                    <td><span class="badge ${prioridadClass}">${ot.prioridad || '-'}</span></td>
                    <td><span class="badge ${estadoClass}">${ot.estado || '-'}</span></td>
                    <td>${ot.created_at ? new Date(ot.created_at).toLocaleDateString() : '-'}</td>
                    <td class="action-buttons">
                        <button class="btn-icon btn-view" onclick="verOT(${ot.id})">👁️</button>
                        ${currentUserRol === 'admin' || currentUserRol === 'supervisor' ? `<button class="btn-icon btn-edit" onclick="editarOT(${ot.id})">✏️</button>` : ''}
                        ${currentUserRol === 'admin' ? `<button class="btn-icon btn-delete" onclick="eliminarOT(${ot.id})">🗑️</button>` : ''}
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('otsTable').innerHTML = html || '<p style="color:#888;">No hay órdenes de trabajo</p>';
        }

        function filtrarOTs() {
            const search = document.getElementById('searchOT').value.toLowerCase();
            const estado = document.getElementById('filterEstadoOT').value;
            let filtered = otsData;
            if (search) filtered = filtered.filter(ot => ot.numero_ot?.toLowerCase().includes(search) || ot.titulo?.toLowerCase().includes(search));
            if (estado) filtered = filtered.filter(ot => ot.estado === estado);
            renderizarOTs(filtered);
        }

        async function cargarSelectEquipos() {
            const { data } = await supabase.from('equipos').select('id, nombre, codigo_completo').order('nombre');
            const select = document.getElementById('otEquipoId');
            select.innerHTML = '<option value="">SELECCIONE UN EQUIPO</option>';
            data?.forEach(e => select.innerHTML += `<option value="${e.id}">${e.nombre} (${e.codigo_completo})</option>`);
        }

        async function crearOT() {
            const nuevaOT = {
                titulo: document.getElementById('otTitulo').value,
                equipo_id: document.getElementById('otEquipoId').value || null,
                descripcion: document.getElementById('otDescripcion').value,
                prioridad: document.getElementById('otPrioridad').value,
                tipo_mantenimiento: document.getElementById('otTipo').value,
                estado: 'Pendiente',
                solicitado_por: currentUser?.id
            };
            if (!nuevaOT.titulo) { alert('El título es obligatorio'); return; }
            const { error } = await supabase.from('ordenes_trabajo').insert([nuevaOT]);
            if (error) alert('Error: ' + error.message);
            else { alert('OT creada exitosamente'); closeModal('otModal'); document.getElementById('otForm').reset(); cargarOTs(); }
        }

        async function verOT(id) {
            const { data: ot } = await supabase.from('ordenes_trabajo').select('*, equipos(*)').eq('id', id).single();
            const { data: actividades } = await supabase.from('actividades_ot').select('*').eq('orden_trabajo_id', id).order('orden');
            let actHtml = '<table class="data-table"><thead><tr><th>DESCRIPCIÓN</th><th>TÉCNICO</th><th>INICIO</th><th>FIN</th><th>HORAS</th></tr></thead><tbody>';
            actividades?.forEach(a => actHtml += `<tr><td>${a.descripcion}</td><td>${a.tecnico || '-'}</td><td>${a.inicio ? new Date(a.inicio).toLocaleString() : '-'}</td><td>${a.fin ? new Date(a.fin).toLocaleString() : '-'}</td><td>${a.total_horas || '-'}</td></tr>`);
            actHtml += '</tbody></table>';
            document.getElementById('viewOTContent').innerHTML = `
                <div style="max-height:500px; overflow-y:auto;">
                    <h3 style="color:#ff3b30;">${ot.numero_ot}</h3>
                    <p><strong>📌 Título:</strong> ${ot.titulo}</p>
                    <p><strong>🔧 Equipo:</strong> ${ot.equipos?.nombre || '-'}</p>
                    <p><strong>⚠️ Prioridad:</strong> ${ot.prioridad}</p>
                    <p><strong>📊 Estado:</strong> ${ot.estado}</p>
                    <p><strong>📝 Descripción:</strong> ${ot.descripcion || '-'}</p>
                    <hr style="border-color:#2a2a2a; margin:15px 0;">
                    <h4>⏱️ ACTIVIDADES</h4>
                    ${actHtml}
                    <button class="btn" style="margin-top:15px;" onclick="closeModal('viewOTModal')">CERRAR</button>
                </div>`;
            openModal('viewOTModal');
        }

        async function editarOT(id) {
            const { data: ot } = await supabase.from('ordenes_trabajo').select('*').eq('id', id).single();
            const nuevoEstado = prompt('Nuevo estado (Pendiente, En Progreso, Completada, Cancelada):', ot.estado);
            if (nuevoEstado && ['Pendiente', 'En Progreso', 'Completada', 'Cancelada'].includes(nuevoEstado)) {
                await supabase.from('ordenes_trabajo').update({ estado: nuevoEstado, updated_at: new Date() }).eq('id', id);
                cargarOTs();
            }
        }

        async function eliminarOT(id) {
            if (confirm('¿Eliminar esta OT y todas sus actividades?')) {
                await supabase.from('actividades_ot').delete().eq('orden_trabajo_id', id);
                await supabase.from('ordenes_trabajo').delete().eq('id', id);
                cargarOTs();
            }
        }

        init();
    </script>
</body>
</html>
