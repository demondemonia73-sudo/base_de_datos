<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes de Trabajo - Sistema de Mantenimiento</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <style>
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .close-modal { cursor: pointer; font-size: 24px; }
        .badge-pendiente { background: #ffc107; color: #333; padding: 4px 8px; border-radius: 20px; font-size: 12px; }
        .badge-progreso { background: #17a2b8; color: white; padding: 4px 8px; border-radius: 20px; font-size: 12px; }
        .badge-completada { background: #28a745; color: white; padding: 4px 8px; border-radius: 20px; font-size: 12px; }
        .badge-cancelada { background: #6c757d; color: white; padding: 4px 8px; border-radius: 20px; font-size: 12px; }
        .btn-icon { padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-view { background: #17a2b8; color: white; }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-delete { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>🔧 Sistema de Mantenimiento</h2>
        <div class="nav-menu">
            <a href="dashboard.html"><button class="nav-btn">📊 Dashboard</button></a>
            <a href="equipos.html"><button class="nav-btn">🔌 Equipos</button></a>
            <a href="ordenes.html"><button class="nav-btn active">📋 Órdenes OT</button></a>
            <a href="actividades.html"><button class="nav-btn">⏱️ Actividades</button></a>
            <a href="reportes.html"><button class="nav-btn">📈 Reportes</button></a>
            <button class="nav-btn logout-btn" onclick="logout()">🚪 Salir</button>
        </div>
        <div>👤 <span id="userName"></span> | <span id="userRol"></span></div>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-header">
                <h3>📋 Órdenes de Trabajo</h3>
                <button class="btn" style="width: auto; padding: 8px 20px;" onclick="openModal()">➕ Nueva OT</button>
            </div>
            <div class="filter-bar">
                <input type="text" id="searchOT" placeholder="🔍 Buscar OT..." onkeyup="filtrarOTs()">
                <select id="filterEstadoOT" onchange="filtrarOTs()">
                    <option value="">📊 Todos los estados</option>
                    <option value="Pendiente">⏳ Pendiente</option>
                    <option value="En Progreso">🔄 En Progreso</option>
                    <option value="Completada">✅ Completada</option>
                    <option value="Cancelada">❌ Cancelada</option>
                </select>
            </div>
            <div id="otsTable"></div>
        </div>
    </div>

    <!-- Modal Nueva OT -->
    <div id="otModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>➕ Nueva OT</h3><span class="close-modal" onclick="closeModal()">&times;</span></div>
            <form id="otForm" onsubmit="event.preventDefault(); crearOT()">
                <div class="form-group"><label>Título *</label><input type="text" id="otTitulo" required></div>
                <div class="form-group"><label>Equipo</label><select id="otEquipoId"></select></div>
                <div class="form-group"><label>Descripción</label><textarea id="otDescripcion" rows="3"></textarea></div>
                <div class="form-group"><label>Prioridad</label><select id="otPrioridad"><option value="Baja">🟢 Baja</option><option value="Normal" selected>🔵 Normal</option><option value="Alta">🟠 Alta</option><option value="Urgente">🔴 Urgente</option></select></div>
                <div class="form-group"><label>Tipo</label><select id="otTipo"><option value="Preventivo">🔧 Preventivo</option><option value="Correctivo">🛠️ Correctivo</option><option value="Predictivo">📊 Predictivo</option><option value="Emergencia">🚨 Emergencia</option></select></div>
                <button type="submit" class="btn">Crear OT</button>
            </form>
        </div>
    </div>

    <script>
        let supabase, otsData = [], currentUser = null, currentUserRol = null;

        async function init() {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;
            const { data: perfil } = await supabase.from('perfiles').select('*').eq('id', session.user.id).single();
            currentUserRol = perfil?.rol || 'operador';
            document.getElementById('userName').textContent = perfil?.nombre || 'Usuario';
            document.getElementById('userRol').textContent = currentUserRol.toUpperCase();
            await cargarOTs();
            await cargarSelectEquipos();
        }

        async function cargarOTs() {
            const { data, error } = await supabase.from('ordenes_trabajo').select(`*, equipos(nombre)`).order('id', { ascending: false });
            if (error) console.error(error);
            otsData = data || [];
            renderizarOTs(otsData);
        }

        function renderizarOTs(ots) {
            let html = '<table><thead><tr><th>N° OT</th><th>Equipo</th><th>Título</th><th>Prioridad</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>';
            ots.forEach(ot => {
                let estadoClass = ot.estado === 'Pendiente' ? 'badge-pendiente' : (ot.estado === 'En Progreso' ? 'badge-progreso' : (ot.estado === 'Completada' ? 'badge-completada' : 'badge-cancelada'));
                html += `<tr><td>${ot.numero_ot || '-'}</td><td>${ot.equipos?.nombre || ot.equipo_nombre || '-'}</td><td>${ot.titulo || '-'}</td><td>${ot.prioridad || '-'}</td><td><span class="${estadoClass}">${ot.estado || '-'}</span></td><td>${ot.created_at ? new Date(ot.created_at).toLocaleDateString() : '-'}</td>
                <td><button class="btn-icon btn-view" onclick="verOT(${ot.id})">👁️</button>${(currentUserRol === 'admin' || currentUserRol === 'supervisor') ? `<button class="btn-icon btn-edit" onclick="editarOT(${ot.id})">✏️</button>` : ''}${currentUserRol === 'admin' ? `<button class="btn-icon btn-delete" onclick="eliminarOT(${ot.id})">🗑️</button>` : ''}</td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('otsTable').innerHTML = html || '<p>No hay órdenes de trabajo</p>';
        }

        function filtrarOTs() {
            const search = document.getElementById('searchOT').value.toLowerCase();
            const estado = document.getElementById('filterEstadoOT').value;
            let filtered = otsData;
            if (search) filtered = filtered.filter(ot => ot.numero_ot?.toLowerCase().includes(search) || ot.titulo?.toLowerCase().includes(search));
            if (estado) filtered = filtered.filter(ot => ot.estado === estado);
            renderizarOTs(filtered);
        }

        async function cargarSelectEquipos() {
            const { data } = await supabase.from('equipos').select('id, nombre, codigo_completo').order('nombre');
            const select = document.getElementById('otEquipoId');
            select.innerHTML = '<option value="">Seleccione un equipo</option>';
            data?.forEach(e => select.innerHTML += `<option value="${e.id}">${e.nombre} (${e.codigo_completo})</option>`);
        }

        async function crearOT() {
            const nuevaOT = { titulo: document.getElementById('otTitulo').value, equipo_id: document.getElementById('otEquipoId').value || null, descripcion: document.getElementById('otDescripcion').value, prioridad: document.getElementById('otPrioridad').value, tipo_mantenimiento: document.getElementById('otTipo').value, estado: 'Pendiente', solicitado_por: currentUser?.id };
            if (!nuevaOT.titulo) { alert('El título es obligatorio'); return; }
            const { error } = await supabase.from('ordenes_trabajo').insert([nuevaOT]);
            if (error) alert('Error: ' + error.message);
            else { alert('OT creada'); closeModal(); document.getElementById('otForm').reset(); cargarOTs(); }
        }

        function openModal() { document.getElementById('otModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('otModal').style.display = 'none'; }
        function verOT(id) { window.location.href = `actividades.html?ot_id=${id}`; }
        function editarOT(id) { /* Implementar edición */ alert('Editar OT #' + id); }
        async function eliminarOT(id) { if (confirm('¿Eliminar OT?')) { await supabase.from('ordenes_trabajo').delete().eq('id', id); cargarOTs(); } }
        async function logout() { await supabase.auth.signOut(); window.location.href = 'index.html'; }
        
        init();
    </script>
</body>
</html>
