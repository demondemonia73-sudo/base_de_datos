
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS - Actividades</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">🔧</div>
            <div class="logo-text">
                <h1>INDUSTRIAL MS</h1>
                <p>MAINTENANCE SYSTEM</p>
            </div>
        </div>
        <div class="nav-menu">
            <button class="nav-btn" onclick="location.href='dashboard.html'">📊 DASHBOARD</button>
            <button class="nav-btn" onclick="location.href='equipos.html'">🔌 EQUIPOS</button>
            <button class="nav-btn" onclick="location.href='ordenes.html'">📋 OT</button>
            <button class="nav-btn active" onclick="location.href='actividades.html'">⏱️ ACTIVIDADES</button>
            <button class="nav-btn" onclick="location.href='reportes.html'">📈 REPORTES</button>
            <button class="nav-btn logout-btn" id="logoutBtn">🚪 SALIR</button>
        </div>
        <div class="user-info">
            <div class="user-avatar">👤</div>
            <div class="user-details">
                <div class="user-name" id="userName">Usuario</div>
                <div class="user-role" id="userRol">ADMIN</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <div class="card-header">
                <div class="card-title">⏱️ ACTIVIDADES DE MANTENIMIENTO</div>
                <button class="btn" onclick="openModal('actividadModal')">➕ NUEVA ACTIVIDAD</button>
            </div>
            <div id="actividadesTable"></div>
        </div>
    </div>

    <!-- Modal Nueva Actividad -->
    <div id="actividadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>➕ NUEVA ACTIVIDAD</h3>
                <span class="close-modal" onclick="closeModal('actividadModal')">&times;</span>
            </div>
            <form id="actividadForm" onsubmit="event.preventDefault(); crearActividad()">
                <div class="form-group">
                    <label>ORDEN DE TRABAJO *</label>
                    <select id="actividadOtId" required></select>
                </div>
                <div class="form-group">
                    <label>DESCRIPCIÓN *</label>
                    <textarea id="actividadDescripcion" rows="3" required placeholder="Detalle de la actividad..."></textarea>
                </div>
                <div class="form-group">
                    <label>TÉCNICO RESPONSABLE</label>
                    <input type="text" id="actividadTecnico" placeholder="Nombre del técnico">
                </div>
                <div class="form-group">
                    <label>FECHA/HORA INICIO</label>
                    <input type="datetime-local" id="actividadInicio">
                </div>
                <div class="form-group">
                    <label>FECHA/HORA FIN</label>
                    <input type="datetime-local" id="actividadFin">
                </div>
                <div class="form-group">
                    <label>ESTADO</label>
                    <select id="actividadEstado">
                        <option value="Pendiente">⏳ PENDIENTE</option>
                        <option value="En Progreso">🔄 EN PROGRESO</option>
                        <option value="Completada">✅ COMPLETADA</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="width:100%;">CREAR ACTIVIDAD</button>
            </form>
        </div>
    </div>

    <script>
        let actividadesData = [];

        async function init() {
            await verificarSesion();
            document.getElementById('logoutBtn').onclick = logout;
            await cargarActividades();
            await cargarSelectOT();
        }

        async function cargarActividades() {
            const { data, error } = await supabase.from('actividades_ot').select(`*, ordenes_trabajo(numero_ot, titulo)`).order('id', { ascending: false });
            if (error) console.error(error);
            actividadesData = data || [];
            renderizarActividades(actividadesData);
        }

        function renderizarActividades(actividades) {
            let html = '<table class="data-table"><thead><tr><th>OT</th><th>DESCRIPCIÓN</th><th>TÉCNICO</th><th>INICIO</th><th>FIN</th><th>HORAS</th><th>ESTADO</th><th>ACCIONES</th></tr></thead><tbody>';
            actividades.forEach(act => {
                let estadoClass = act.estado === 'Pendiente' ? 'badge-pending' : (act.estado === 'En Progreso' ? 'badge-progress' : 'badge-completed');
                html += `<tr>
                    <td><strong>${act.ordenes_trabajo?.numero_ot || '-'}</strong></td>
                    <td>${act.descripcion || '-'}</td>
                    <td>${act.tecnico || '-'}</td>
                    <td>${act.inicio ? new Date(act.inicio).toLocaleString() : '-'}</td>
                    <td>${act.fin ? new Date(act.fin).toLocaleString() : '-'}</td>
                    <td>${act.total_horas || '-'}</td>
                    <td><span class="badge ${estadoClass}">${act.estado || 'Pendiente'}</span></td>
                    <td class="action-buttons">
                        ${currentUserRol === 'admin' || currentUserRol === 'supervisor' || currentUserRol === 'tecnico' ? `<button class="btn-icon btn-edit" onclick="editarActividad(${act.id})">✏️</button>` : ''}
                        ${currentUserRol === 'admin' ? `<button class="btn-icon btn-delete" onclick="eliminarActividad(${act.id})">🗑️</button>` : ''}
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('actividadesTable').innerHTML = html || '<p style="color:#888;">No hay actividades registradas</p>';
        }

        async function cargarSelectOT() {
            const { data } = await supabase.from('ordenes_trabajo').select('id, numero_ot, titulo').order('id', { ascending: false });
            const select = document.getElementById('actividadOtId');
            select.innerHTML = '<option value="">SELECCIONE UNA OT</option>';
            data?.forEach(ot => select.innerHTML += `<option value="${ot.id}">${ot.numero_ot} - ${ot.titulo}</option>`);
        }

        async function crearActividad() {
            const inicio = document.getElementById('actividadInicio').value;
            const fin = document.getElementById('actividadFin').value;
            let totalHoras = null;
            if (inicio && fin) totalHoras = ((new Date(fin) - new Date(inicio)) / (1000 * 60 * 60)).toFixed(2);
            const nuevaActividad = {
                orden_trabajo_id: document.getElementById('actividadOtId').value || null,
                descripcion: document.getElementById('actividadDescripcion').value,
                tecnico: document.getElementById('actividadTecnico').value,
                inicio: inicio || null,
                fin: fin || null,
                total_horas_numeric: totalHoras,
                estado: document.getElementById('actividadEstado').value,
                orden: 0
            };
            if (!nuevaActividad.descripcion) { alert('La descripción es obligatoria'); return; }
            const { error } = await supabase.from('actividades_ot').insert([nuevaActividad]);
            if (error) alert('Error: ' + error.message);
            else { alert('Actividad creada'); closeModal('actividadModal'); document.getElementById('actividadForm').reset(); cargarActividades(); }
        }

        async function editarActividad(id) {
            const { data: act } = await supabase.from('actividades_ot').select('*').eq('id', id).single();
            const nuevoEstado = prompt('Nuevo estado (Pendiente, En Progreso, Completada):', act.estado);
            if (nuevoEstado && ['Pendiente', 'En Progreso', 'Completada'].includes(nuevoEstado)) {
                await supabase.from('actividades_ot').update({ estado: nuevoEstado, updated_at: new Date() }).eq('id', id);
                cargarActividades();
            }
        }

        async function eliminarActividad(id) {
            if (confirm('¿Eliminar esta actividad?')) {
                await supabase.from('actividades_ot').delete().eq('id', id);
                cargarActividades();
            }
        }

        init();
    </script>
</body>
</html>
