<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial MS — Actividades</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js"></script>
</head>
<body>

<header class="header">
    <div class="logo-area">
        <div class="logo-icon">🔧</div>
        <div class="logo-text"><h1>INDUSTRIAL MS</h1><p>MAINTENANCE SYSTEM</p></div>
    </div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menú">
        <span></span><span></span><span></span>
    </button>
    <nav class="nav-menu" id="navMenu">
        <button class="nav-btn" onclick="location.href='dashboard.html'">📊 Dashboard</button>
        <button class="nav-btn" onclick="location.href='equipos.html'">🔌 Equipos</button>
        <button class="nav-btn" onclick="location.href='ordenes.html'">📋 Órdenes</button>
        <button class="nav-btn active" onclick="location.href='actividades.html'">⏱ Actividades</button>
        <button class="nav-btn" onclick="location.href='reportes.html'">📈 Reportes</button>
        <button class="nav-btn" id="navUsuarios" onclick="location.href='usuarios.html'" style="display:none;">👥 Usuarios</button>
        <button class="nav-btn logout-btn" id="logoutBtn">🚪 Salir</button>
    </nav>
    <div class="user-info">
        <div class="user-avatar">👤</div>
        <div><div class="user-name" id="userName">—</div><div class="user-role" id="userRol">—</div></div>
    </div>
</header>

<main class="main-content">

    <div class="page-header">
        <div>
            <div class="page-title">Actividades</div>
            <div class="page-subtitle" id="actsCount">Cargando...</div>
        </div>
        <button class="btn" onclick="openModal('modalNuevaAct')">➕ Nueva Actividad</button>
    </div>

    <div class="card">
        <div class="filter-bar">
            <input type="text" id="searchAct" placeholder="🔍 Buscar por descripción o técnico..." oninput="filtrar()">
            <select id="filterEstado" onchange="filtrar()">
                <option value="">Todos los estados</option>
                <option value="Pendiente">Pendiente</option>
                <option value="En Progreso">En Progreso</option>
                <option value="Completada">Completada</option>
            </select>
        </div>
        <div class="table-wrapper" id="actsTable">
            <div class="empty-state"><div class="empty-icon">⏱</div><p>Cargando actividades...</p></div>
        </div>
    </div>

</main>

<!-- ===== MODAL: Nueva Actividad ===== -->
<div id="modalNuevaAct" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>➕ Nueva Actividad</h3>
            <span class="close-modal" onclick="closeModal('modalNuevaAct')">✕</span>
        </div>
        <div class="form-group">
            <label>Orden de Trabajo *</label>
            <select id="actOtId"></select>
        </div>
        <div class="form-group">
            <label>Descripción *</label>
            <textarea id="actDesc" rows="3" placeholder="Describa la actividad realizada..."></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Técnico</label>
                <input type="text" id="actTecnico" placeholder="Nombre del técnico">
            </div>
            <div class="form-group">
                <label>Estado</label>
                <select id="actEstado">
                    <option value="Pendiente">Pendiente</option>
                    <option value="En Progreso">En Progreso</option>
                    <option value="Completada">Completada</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Fecha/Hora Inicio</label>
                <input type="datetime-local" id="actInicio">
            </div>
            <div class="form-group">
                <label>Fecha/Hora Fin</label>
                <input type="datetime-local" id="actFin">
            </div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
            <button class="btn btn-secondary" onclick="closeModal('modalNuevaAct')">Cancelar</button>
            <button class="btn" onclick="submitNuevaAct()">Crear Actividad</button>
        </div>
    </div>
</div>

<!-- ===== MODAL: Editar Actividad ===== -->
<div id="modalEditarAct" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>✏️ Editar Actividad</h3>
            <span class="close-modal" onclick="closeModal('modalEditarAct')">✕</span>
        </div>
        <input type="hidden" id="editActId">
        <div class="form-group">
            <label>Descripción</label>
            <textarea id="editActDesc" rows="3"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Técnico</label>
                <input type="text" id="editActTecnico">
            </div>
            <div class="form-group">
                <label>Estado</label>
                <select id="editActEstado">
                    <option value="Pendiente">Pendiente</option>
                    <option value="En Progreso">En Progreso</option>
                    <option value="Completada">Completada</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Fecha/Hora Inicio</label>
                <input type="datetime-local" id="editActInicio">
            </div>
            <div class="form-group">
                <label>Fecha/Hora Fin</label>
                <input type="datetime-local" id="editActFin">
            </div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
            <button class="btn btn-secondary" onclick="closeModal('modalEditarAct')">Cancelar</button>
            <button class="btn" onclick="submitEditarAct()">Guardar Cambios</button>
        </div>
    </div>
</div>

<script>
    let _acts = [];

    async function init() {
        await cargarHeader('actividades');
        await loadActs();
        await poblarOTs();
    }

    async function loadActs() {
        try {
            _acts = await cargarActividades();
            document.getElementById('actsCount').textContent = `${_acts.length} actividades registradas`;
            renderizar(_acts);
        } catch (err) {
            mostrarToast('Error cargando actividades: ' + err.message, 'error');
        }
    }

    function renderizar(lista) {
        if (!lista.length) {
            document.getElementById('actsTable').innerHTML =
                '<div class="empty-state"><div class="empty-icon">🔍</div><p>No se encontraron actividades</p></div>';
            return;
        }

        let html = `<table class="data-table">
            <thead><tr>
                <th>OT</th><th>Descripción</th><th>Técnico</th>
                <th>Inicio</th><th>Fin</th><th>Horas</th><th>Estado</th><th>Acciones</th>
            </tr></thead><tbody>`;

        lista.forEach(a => {
            const desc = (a.descripcion || '—').substring(0, 50) + (a.descripcion?.length > 50 ? '…' : '');
            html += `<tr>
                <td><code>${a.ordenes_trabajo?.numero_ot || '—'}</code></td>
                <td>${desc}</td>
                <td style="color:var(--text-secondary)">${a.tecnico || '—'}</td>
                <td style="font-size:11px;color:var(--text-muted)">${formatFechaHora(a.inicio)}</td>
                <td style="font-size:11px;color:var(--text-muted)">${formatFechaHora(a.fin)}</td>
                <td style="font-family:var(--font-mono);font-size:12px">${a.total_horas_numeric != null ? a.total_horas_numeric + ' h' : '—'}</td>
                <td>${badgeEstado(a.estado || 'Pendiente')}</td>
                <td>
                    <div class="action-buttons">
                        <button class="btn-icon btn-edit"   onclick="doEditarAct(${a.id})" title="Editar">✏️</button>
                        <button class="btn-icon btn-delete" onclick="doBorrarAct(${a.id})" title="Eliminar">🗑</button>
                    </div>
                </td>
            </tr>`;
        });

        document.getElementById('actsTable').innerHTML = html + '</tbody></table>';
    }

    function filtrar() {
        const q  = document.getElementById('searchAct').value.toLowerCase();
        const es = document.getElementById('filterEstado').value;

        let r = _acts;
        if (q)  r = r.filter(a => a.descripcion?.toLowerCase().includes(q) || a.tecnico?.toLowerCase().includes(q));
        if (es) r = r.filter(a => a.estado === es);
        renderizar(r);
    }

    async function poblarOTs() {
        const { data } = await window.db.from('ordenes_trabajo')
            .select('id, numero_ot, titulo').order('id', { ascending: false });
        const sel = document.getElementById('actOtId');
        sel.innerHTML = '<option value="">— Seleccione OT —</option>';
        data?.forEach(ot => sel.innerHTML += `<option value="${ot.id}">${ot.numero_ot} · ${ot.titulo}</option>`);
    }

    async function submitNuevaAct() {
        const desc = document.getElementById('actDesc').value.trim();
        if (!desc) { mostrarToast('La descripción es obligatoria', 'warning'); return; }

        const inicio = document.getElementById('actInicio').value;
        const fin    = document.getElementById('actFin').value;
        let horas = null;
        if (inicio && fin) {
            const diff = (new Date(fin) - new Date(inicio)) / (1000 * 60 * 60);
            horas = diff > 0 ? parseFloat(diff.toFixed(2)) : null;
        }

        try {
            await crearActividad({
                orden_trabajo_id: document.getElementById('actOtId').value || null,
                descripcion: desc,
                tecnico: document.getElementById('actTecnico').value || null,
                estado: document.getElementById('actEstado').value,
                inicio: inicio || null,
                fin: fin || null,
                total_horas_numeric: horas,
            });
            mostrarToast('Actividad creada correctamente', 'success');
            closeModal('modalNuevaAct');
            document.getElementById('actDesc').value = '';
            document.getElementById('actTecnico').value = '';
            await loadActs();
        } catch (err) {
            mostrarToast('Error: ' + err.message, 'error');
        }
    }

    function doEditarAct(id) {
        const a = _acts.find(x => x.id === id);
        if (!a) return;
        document.getElementById('editActId').value     = a.id;
        document.getElementById('editActDesc').value   = a.descripcion || '';
        document.getElementById('editActTecnico').value = a.tecnico || '';
        document.getElementById('editActEstado').value = a.estado || 'Pendiente';
        document.getElementById('editActInicio').value = a.inicio
            ? new Date(a.inicio).toISOString().slice(0,16) : '';
        document.getElementById('editActFin').value = a.fin
            ? new Date(a.fin).toISOString().slice(0,16) : '';
        openModal('modalEditarAct');
    }

    async function submitEditarAct() {
        const id     = document.getElementById('editActId').value;
        const inicio = document.getElementById('editActInicio').value;
        const fin    = document.getElementById('editActFin').value;
        let horas = null;
        if (inicio && fin) {
            const diff = (new Date(fin) - new Date(inicio)) / (1000 * 60 * 60);
            horas = diff > 0 ? parseFloat(diff.toFixed(2)) : null;
        }
        try {
            await actualizarActividad(id, {
                descripcion: document.getElementById('editActDesc').value,
                tecnico: document.getElementById('editActTecnico').value || null,
                estado: document.getElementById('editActEstado').value,
                inicio: inicio || null,
                fin: fin || null,
                total_horas_numeric: horas,
            });
            mostrarToast('Actividad actualizada', 'success');
            closeModal('modalEditarAct');
            await loadActs();
        } catch (err) {
            mostrarToast('Error: ' + err.message, 'error');
        }
    }

    async function doBorrarAct(id) {
        if (!confirm('¿Eliminar esta actividad?')) return;
        try {
            await eliminarActividad(id);
            mostrarToast('Actividad eliminada', 'success');
            await loadActs();
        } catch (err) {
            mostrarToast('Error: ' + err.message, 'error');
        }
    }

    initHamburger();
    iniciarKillSwitchCheck();
    init();
</script>
</body>
</html>
